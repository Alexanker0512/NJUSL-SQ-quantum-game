23: () => {
// src\domain\cryogenics.js
const ATM_MBAR = 1013.25;
const PULSE_START_MBAR = 1e-2;

function scientific(value) {
  let exponent = Math.floor(Math.log10(value));
  let coefficient = value / 10 ** exponent;
  // 一位小数舍入为 10.0 时进位，避免显示非标准的 10.0 × 10ⁿ。
  if (Number(coefficient.toFixed(1)) === 10) {coefficient=1;exponent++;}
  return `${coefficient.toFixed(1)} × 10<sup>${exponent}</sup>`;
}

function pressureAt(progress) {
  return ATM_MBAR * (PULSE_START_MBAR / ATM_MBAR) ** progress;
}

function temperatureColor(kelvin) {
  const coldness = Math.max(0, Math.min(1, Math.log(300 / kelvin) / Math.log(300 / 4)));
  return `hsl(${35 + coldness * 172} 60% ${68 - coldness * 16}%)`;
}

return { ATM_MBAR, PULSE_START_MBAR, scientific, pressureAt, temperatureColor };
},

25: () => {
// src\features\cooling\liquid-state.js
/** 液面使用同一坐标模型，避免容器、原子和管道各自计算而错位。 */
function liquidState(fill, temperature) {
  const separated = fill >= .5 && temperature < 870;
  const height = 194 * Math.min(1, fill / .6);
  const surface = 724 - height;
  const diluteHeight = separated ? height * 109 / 194 : 0;
  // 前 60% 到达管口，随后 20% 填管，最后 20% 抬升上方容器液面。
  const pipeFill = Math.max(0, Math.min(1, (fill - .6) / .2));
  const upperFill = separated ? Math.max(0, Math.min(1, (fill - .8) / .2)) : 0;
  return {
    separated,
    height,
    surface,
    boundary: 724 - diluteHeight,
    diluteHeight,
    upperFill,
    pipeFill,
    upperSurface: 422 - 71 * upperFill
  };
}

function updateLiquidLayers(root, state, fill) {
  function liquidRect(id, top, bottom, visible) {
    const node = root.querySelector(id);
    node.setAttribute('y', top);
    node.setAttribute('height', bottom - top);
    node.setAttribute('opacity', visible ? '1' : '0');
  }
  liquidRect('#concentrated-phase', state.surface, state.boundary, fill > 0);
  liquidRect('#dilute-phase', state.boundary, 724, state.separated);
  liquidRect('#still-liquid', state.upperSurface, 422, state.upperFill > 0);
  liquidRect('#condensed-liquid', state.upperSurface, 422, state.upperFill > 0);
  root.querySelector('#phase-boundary').setAttribute('d', `M245 ${state.boundary}H490`);
  root.querySelector('#phase-boundary').style.opacity = state.separated ? '1' : '0';
  for (const [id, left, right] of [['#still-surface',430,648],['#condensed-surface',224,306]]) {
    const node = root.querySelector(id);
    node.setAttribute('d', `M${left} ${state.upperSurface}H${right}`);
    node.setAttribute('opacity', state.upperFill > 0 ? '1' : '0');
  }
  for (const id of ['#concentrated-liquid-pipe','#dilute-liquid-pipe']) {
    const pipe = root.querySelector(id);
    pipe.setAttribute('opacity', state.pipeFill > 0 ? '1' : '0');
    pipe.setAttribute('pathLength','100');
    pipe.setAttribute('stroke-dasharray',`${state.pipeFill * 100} 100`);
  }
  root.querySelector('#mixture-surface').dataset.liquidPhase = state.separated ? 'separated' : 'filling';
}

return { liquidState, updateLiquidLayers };
},
26: () => {
// src\features\cooling\heat-flow.js
/** 红球仅表示热量，频率由冷却进度控制，稳定后仍保留热流。 */
function createHeatFlow(root) {
  const packet = root.querySelector('#heat-packet');
  const platform = root.querySelector('#sample-platform');
  let elapsed = 0;
  let nextEmission = 0;
  let emittedAt = -Infinity;
  let count = 0;

  return function updateHeat({delta, flow, temperature, surface}) {
    if (!flow) return;
    elapsed += delta;
    const cooling = Math.max(0, Math.min(1, Math.log(4000 / temperature) / Math.log(4000 / 10)));
    const interval = 1.15 + cooling * 3.35;
    if (elapsed >= nextEmission) {
      emittedAt = elapsed;
      nextEmission = elapsed + interval;
      packet.dataset.emissions = String(++count);
    }
    const progress = (elapsed - emittedAt) / 1.05;
    packet.style.opacity = progress < 1 ? String(Math.min(1,(1-progress)*5)) : '0';
    packet.dataset.interval = interval.toFixed(2);
    if (progress < 1) {
      packet.setAttribute('cx','370');
      packet.setAttribute('cy',807 - progress * (807 - Math.max(surface + 10,615)));
    }
    const warm = [237,150,100], cold = [37,111,137];
    platform.setAttribute('fill','rgb('+warm.map((value,i)=>Math.round(value+(cold[i]-value)*cooling)).join(',')+')');
  };
}

return { createHeatFlow };
},

// src\features\cooling\evaporation-rate.js
/** 教学速率窗口：50～90 为精调区，中心 70 最冷，边缘恰为 50 mK。 */
function evaporationTemperature(rate) {
  const distance = Math.abs(rate - 70);
  if (distance <= 20) return 10 + 2 * distance;
  return 50 + 2 * (distance - 20) + .22 * (distance - 20) ** 2;
}

return { evaporationTemperature };
},
28: () => {
// src\features\cooling\cooper-pairs.js
const { randomBetween } = loadModule(12);

function tunnelEncounter(firstEncounter, random = Math.random) {
  const pass = random() < .65;
  return {pass, split: !pass && firstEncounter && random() < .5};
}

/** 五对电子的持续运动；仅首次碰壁失败有拆对机会，通关统计不同的成功电子对。 */
function createCooperPairs({root,showToast,beep}) {
  let selected = null, enabled = false, successes = 0;
  const pairs = [];
  const electrons = [...root.querySelectorAll('[data-electron]')].map((node,i) => ({
    node, x:80+i%5*48, y:55+Math.floor(i/5)*65,
    vx:randomBetween(-6,8), vy:randomBetween(-6,6), paired:false
  }));
  function status(message) {
    root.querySelector('#pair-status').textContent = `${message} · ${successes}/2 对成功`;
  }
  electrons.forEach(electron => {
    function choose() {
      if (!enabled || electron.paired) return;
      if (!selected) {selected=electron;electron.node.classList.add('selected');return;}
      if (selected===electron) {selected=null;electron.node.classList.remove('selected');return;}
      if (selected.node.dataset.spin===electron.node.dataset.spin) {showToast('请选择箭头相反的电子。');return;}
      if ((selected.x<350)!==(electron.x<350)) {showToast('请在同一侧电极中选择电子。');return;}
      const partners=[selected,electron];
      const node=document.createElementNS('http://www.w3.org/2000/svg','g');
      node.innerHTML='<circle cx="-11" r="13" fill="#53d3da"/><circle cx="11" r="13" fill="#b79bdd"/><path d="M-11 0H11" stroke="#bcffe6" stroke-width="4"/>';
      root.querySelector('#cooper-pairs').append(node);
      pairs.push({node,partners,x:(selected.x+electron.x)/2,y:(selected.y+electron.y)/2,
        vx:selected.x<350?55:-55,vy:randomBetween(-9,9),firstEncounter:true,crossing:false,counted:false,removed:false});
      partners.forEach(e=>{e.paired=true;e.node.classList.remove('selected');e.node.classList.add('paired');});
      selected=null;status('配对成功，观察势垒');beep(670,.06);
    }
    electron.node.addEventListener('click',choose);
    electron.node.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();choose();}});
  });
  function split(pair) {
    pair.removed=true;pair.node.remove();
    pair.partners.forEach((e,i)=>{
      e.paired=false;e.x=pair.x+(i?15:-15);e.y=pair.y+(i?12:-12);
      e.vx=pair.x<350?-8:8;e.node.classList.remove('paired');
    });
    status('首次隧穿失败，已拆对，可重新配对');
  }
  return function update(delta,ready) {
    enabled=ready;
    electrons.forEach(e=>{
      if(e.paired)return;
      const left=e.x<350, min=left?65:415, max=left?310:650;
      e.vx=Math.max(-12,Math.min(12,e.vx+randomBetween(-5,5)*delta));
      e.x+=(e.vx+(left?4:-4))*delta;e.y+=e.vy*delta;
      if(e.x<min||e.x>max){e.x=Math.max(min,Math.min(max,e.x));e.vx=e.x===min?10:-10;}
      if(e.y<43||e.y>140){e.y=Math.max(43,Math.min(140,e.y));e.vy*=-1;}
      e.node.setAttribute('transform',`translate(${e.x} ${e.y})`);
    });
    pairs.forEach(pair=>{
      if(pair.removed)return;
      const previous=pair.x;
      pair.x+=pair.vx*delta;pair.y+=pair.vy*delta;
      if(pair.y<43||pair.y>140){pair.y=Math.max(43,Math.min(140,pair.y));pair.vy*=-1;}
      if(pair.x<70||pair.x>645){pair.x=Math.max(70,Math.min(645,pair.x));pair.vx*=-1;}
      const encounter=!pair.crossing && ((previous<=310&&pair.x>=310&&pair.vx>0)||(previous>=410&&pair.x<=410&&pair.vx<0));
      if(encounter){
        const {pass,split:breakPair}=tunnelEncounter(pair.firstEncounter);
        if(pass) pair.crossing=true;
        else {
          pair.x=pair.vx>0?309:411;pair.vx*=-1;
          if(breakPair)split(pair);
          else status('被反射，保持配对继续运动');
        }
        pair.firstEncounter=false;
      }
      if(pair.crossing&&((pair.vx>0&&pair.x>410)||(pair.vx<0&&pair.x<310))){
        pair.crossing=false;
        if(!pair.counted){pair.counted=true;successes++;}
        status('成对隧穿成功，继续运动');
        root.querySelector('#cooling-finish').disabled=successes<2;
      }
      pair.node.setAttribute('transform',`translate(${pair.x} ${pair.y})`);
    });
  };
}

return { tunnelEncounter, createCooperPairs };
},

      experiment.save({circuit,ideal,actual:ideal,noise,calibrationAccuracy,protectionScore:Math.round((1-noise)*100),stateFidelity:fidelity(ideal,ideal,noise),createdAt:Date.now()});
      root.querySelector('#algorithm-result').hidden=false;

      trajectories.clear();
      root.querySelector('.workbench').dataset.phase='complete';
    }});
    root.querySelector('#run-algorithm').addEventListener('click',()=>{
      ideal=runCircuit(circuit);
      root.querySelector('.workbench').dataset.phase='ready';
      root.querySelectorAll('.circuit-editor button').forEach(b=>b.disabled=true);
      root.querySelector('#run-algorithm').disabled=true;
      root.querySelector('#protection-start').hidden=false;
      root.querySelector('#processor-status').textContent='准备好后点击开始保护 · 点掉来袭干扰';
    });
    function replay(withoutNoise) {
      purePlayback=withoutNoise;
      trajectories.clear();
      running=true;finished=false;noise=0;displayedStep=-1;
      root.querySelector('#algorithm-result').hidden=true;
      root.querySelector('.workbench').dataset.phase='running';
      root.querySelector('.workbench').dataset.playback=purePlayback?'pure':'defense';
      root.querySelector('#protection-start').textContent='再来一次';
      root.querySelector('#pure-playback').hidden=false;
      root.querySelector('.mission span').textContent=purePlayback
        ? '金色虚线表示当前门尚未走过的轨迹，走过即消失。纠缠时，单个比特的状态可能进入球内。'
        : '点击从四周靠近量子比特的噪声，保护 8 秒；点击“再来一次”可重置本次演算。';
      root.querySelector('#processor-status').textContent=purePlayback?'无噪声 · 虚线为当前门尚未走过的轨迹':'点掉来袭干扰 · 保护 8 秒';
      defense.start({withNoise:!purePlayback});
    }
    root.querySelector('#protection-start').addEventListener('click',()=>replay(false));
    root.querySelector('#pure-playback').addEventListener('click',()=>replay(true));
    root.querySelector('#control-finish').addEventListener('click',()=>awardLevel(4,{'微波校准':calibrationAccuracy,'门操作':100,'量子态保真度':Math.round(fidelity(ideal,ideal,noise)*100)},noise===0&&!purePlayback?['五比特量子守卫']:[]));
    if(context.testStep==='protection') {
      root.querySelector('#ghz-example').click();
      root.querySelector('#run-algorithm').click();
    }
  }
}

return { mount };
},

31: () => {
// src\ui\bloch.js
const azimuth = 20 * Math.PI / 180;
const elevation = 20 * Math.PI / 180;
/** 正交投影：屏幕基向量互相垂直且长度为 1，单位球不会投到轮廓外。 */
function projectBloch({x,y,z}) {
  return {
    x:110+76*(Math.cos(azimuth)*x+Math.sin(azimuth)*y),
    y:110+76*(Math.sin(azimuth)*Math.sin(elevation)*x-Math.cos(azimuth)*Math.sin(elevation)*y-Math.cos(elevation)*z)
  };
}
function gridCircle(plane) {
  return Array.from({length:97},(_,i)=>{
    const angle=i*Math.PI/48, a=Math.cos(angle),b=Math.sin(angle);
    const point=projectBloch(plane==='xy'?{x:a,y:b,z:0}:plane==='xz'?{x:a,y:0,z:b}:{x:0,y:a,z:b});
    return `${i?'L':'M'}${point.x} ${point.y}`;
  }).join(' ')+' Z';
}
function blochSvg(id, label = 'Q0') {
  const north=projectBloch({x:0,y:0,z:1});
  const axes=[{x:1,y:0,z:0},{x:0,y:1,z:0},{x:0,y:0,z:1}].map(vector=>{
    const point=projectBloch({x:vector.x*1.16,y:vector.y*1.16,z:vector.z*1.16});
    return `M${220-point.x} ${220-point.y}L${point.x} ${point.y}`;
  }).join(' ');
  const xLabel=projectBloch({x:1.25,y:0,z:0}),yLabel=projectBloch({x:0,y:1.25,z:0});
  return `<svg class="bloch-sphere" viewBox="0 0 220 220" data-bloch="${id}" aria-label="${label} Bloch 球">
   <defs><radialGradient id="sphere-${id}" cx=".3" cy=".25"><stop stop-color="#318fac" stop-opacity=".22"/><stop offset="1" stop-color="#071b30" stop-opacity=".7"/></radialGradient></defs>
   <circle cx="110" cy="110" r="76" fill="url(#sphere-${id})" stroke="#356982"/>
   ${['xy','xz','yz'].map(plane=>`<path d="${gridCircle(plane)}" fill="none" stroke="#32728a" stroke-dasharray="3 4"/>`).join('')}
   <path d="${axes}" stroke="#315975" stroke-width="1"/>
   <line class="rotation-axis" x1="40" y1="110" x2="180" y2="110" stroke="#f5b964" stroke-width="2" stroke-dasharray="5 4" opacity=".6"/>
   <line class="state-vector" x1="110" y1="110" x2="${north.x}" y2="${north.y}" stroke="#6ef1e0" stroke-width="3"/>
   <circle class="state-dot" cx="${north.x}" cy="${north.y}" r="5" fill="#d4fffb"/>
   <circle cx="110" cy="110" r="3" fill="#6ef1e0"/>
   <text x="113" y="18">|0⟩</text><text x="112" y="216">|1⟩</text><text x="${xLabel.x}" y="${xLabel.y}">x</text><text x="${yLabel.x}" y="${yLabel.y}">y</text>
 </svg>`;
}
function updateBloch(svg, vector, phase = 0, rotationAxis = null) {
  const end = projectBloch(vector);
  const line = svg.querySelector('.state-vector'),
    dot = svg.querySelector('.state-dot');
  line.setAttribute('x2', end.x);
  line.setAttribute('y2', end.y);
  dot.setAttribute('cx', end.x);
  dot.setAttribute('cy', end.y);
  const axis = svg.querySelector('.rotation-axis');
  const a = projectBloch(rotationAxis || {
    x: Math.cos(phase),
    y: Math.sin(phase),
    z: 0
  });
  axis.setAttribute('x1', 220 - a.x);
  axis.setAttribute('y1', 220 - a.y);
  axis.setAttribute('x2', a.x);
  axis.setAttribute('y2', a.y);
  svg.dataset.purity = ((1 + vector.x ** 2 + vector.y ** 2 + vector.z ** 2) / 2).toFixed(3);
}

return { projectBloch, blochSvg, updateBloch };
},
32: () => {
// src\features\control\calibration.js
const { LEVELS } = loadModule(8);
const { calibrationView } = loadModule(33);
const { updateBloch } = loadModule(31);
const { animate } = loadModule(12);
const { clamp } = loadModule(34);
const { RESONANCE_MHZ, detuningFromSlider, detuningLabel } = loadModule(35);
const { createBlochTrail } = loadModule(36);
const { driveAxis, rotateVector } = loadModule(37);

function mountCalibration({root,scene,shell},onComplete) {
  shell(LEVELS[3],0,2,'对齐青色输出与黄色参考；匹配达到 90% 后发送微波。',calibrationView());
  const find=selector=>root.querySelector(selector),input=selector=>Number(find(selector).value);
  const ctx=find('#pulse-canvas').getContext('2d');
  const sphere=find('[data-bloch="calibration"]'),trail=createBlochTrail(sphere);
  let calibrated=false,match=0,mode='idle',remaining=0,travel=350;
  let vector={x:0,y:0,z:1},pulseAxis={x:1,y:0,z:0};
  const currentAxis=()=>driveAxis(input('#drive-strength'),input('#microwave-phase')*Math.PI/180,detuningFromSlider(input('#drive-frequency')));
  function preparationButtons(show) {
    find('#reset-response').hidden=show;
    find('#prepare-one').hidden=!show;find('#prepare-superposition').hidden=!show;
  }
  function prepare(angle) {
    mode='pulse';remaining=angle;pulseAxis=currentAxis();
    sphere.dataset.motion=mode;
    vector={x:0,y:0,z:1};trail.clear();travel=350;
    preparationButtons(false);find('#continuous-drive').textContent='发送连续波';
  }
  find('#drive-toggle').addEventListener('click',()=>{
    calibrated=true;find('.pulse-settings').hidden=true;find('.response-settings').hidden=false;
    find('#drive-toggle').hidden=true;find('#continuous-drive').hidden=false;find('#calibration-next').disabled=false;
    root.querySelector('.mission span').textContent='强度控制转速；频率和相位改变旋转轴。非共振时，半圈不一定到 |1⟩，¼ 圈也不一定为等概率叠加。';
    prepare(Math.PI);
  });
  find('#reset-response').addEventListener('click',()=>{
    mode='idle';vector={x:0,y:0,z:1};trail.clear();preparationButtons(true);
    find('#continuous-drive').textContent='发送连续波';
  });
  find('#prepare-one').addEventListener('click',()=>prepare(Math.PI));
  find('#prepare-superposition').addEventListener('click',()=>prepare(Math.PI/2));
  find('#continuous-drive').addEventListener('click',()=>{
    mode=mode==='continuous'?'idle':'continuous';preparationButtons(false);
    find('#continuous-drive').textContent=mode==='continuous'?'停止连续波':'发送连续波';
  });
  function draw(delta,detuning) {
    const amplitude=input('#amplitude')/100,duration=input('#duration'),delay=input('#pulse-delay');
    // 可见包络取 ±2σ。前一束移出 2/3 时，下一束前缘进入画面。
    travel+=delta*75;
    const halfWidth=Math.max(60,duration)*6;
    const spacing=900+halfWidth*4/3;
    const center=travel%spacing-halfWidth;
    ctx.fillStyle='#0b1d30';ctx.fillRect(0,0,900,340);ctx.strokeStyle='#284658';ctx.lineWidth=1;
    for(let x=0;x<900;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,340);ctx.stroke();}
    for(let y=20;y<340;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(900,y);ctx.stroke();}
    function wave(a,d,offset,frequency,color,width,continuous=false) {
      ctx.beginPath();ctx.strokeStyle=color;ctx.lineWidth=width;
      for(let x=0;x<900;x++) {
        const carrier=.08*frequency/RESONANCE_MHZ;
        let displacement=0;
        if(continuous)displacement=Math.cos((x-travel)*carrier);
        else for(const repeat of [-1,0,1]) {
          const p=x-center-repeat*spacing-offset;
          if(Math.abs(p)>d*6)continue;
          displacement+=Math.exp(-((p/(d*3))**2))*Math.cos(p*carrier);
        }
        // 发送后的量程容纳 200% 强度，避免波峰被画布裁切。
        const y=(calibrated?170:180)-a*(calibrated?110:130)*displacement;
        if(x===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
      }
      ctx.stroke();
    }
    if(!calibrated) {
      wave(.68,60,0,RESONANCE_MHZ,'#f0c56c',5);
      match=Math.round(clamp(100-Math.abs(amplitude-.68)*110-Math.abs(duration-60)*1.3-Math.abs(delay)*1.1,0,100));
      find('#drive-toggle').disabled=match<90;
    }
    wave(amplitude*(calibrated?input('#drive-strength')/100:1),duration,calibrated?0:delay*3,RESONANCE_MHZ+(calibrated?detuning:0),'#62e5e1',3,mode==='continuous');
    ctx.font='24px sans-serif';ctx.fillStyle='#62e5e1';ctx.fillText(calibrated?'输出波形':'黄色参考 / 青色输出',25,35);
    find('#match-score').textContent=match+'%'+(calibrated?' · 已锁定':'');
    find('#amplitude-value').textContent=Math.round(amplitude*100)+'%';find('#duration-value').textContent=duration+' ns';find('#delay-value').textContent=delay+' ns';
    find('#amplitude-match').textContent='匹配 '+Math.round(clamp(100-Math.abs(amplitude-.68)*110,0,100))+'%';
    find('#duration-match').textContent='匹配 '+Math.round(clamp(100-Math.abs(duration-60)*1.3,0,100))+'%';
  }
  animate(scene,(_,delta)=>{
    const detuning=detuningFromSlider(input('#drive-frequency'));draw(delta,detuning);
    find('#frequency-value').textContent=detuningLabel(detuning);find('#phase-value').textContent=input('#microwave-phase')+'°';find('#strength-value').textContent=input('#drive-strength')+'%';
    const axis=mode==='pulse'?pulseAxis:currentAxis(),moving=mode==='pulse'||mode==='continuous';
    if(moving) {
      const step=delta*2*input('#drive-strength')/100,angle=mode==='pulse'?Math.min(step,remaining):step;
      vector=rotateVector(vector,axis,angle);
      if(mode==='pulse'){remaining-=angle;if(remaining<=0)mode='idle';}
    }
    trail.update(vector,delta,moving);updateBloch(sphere,vector,0,axis);sphere.dataset.motion=mode;
    find('#rabi-readout').textContent='测到 1 的概率 '+((1-vector.z)*50).toFixed(1)+'%';
  });
  find('#calibration-next').addEventListener('click',()=>onComplete(match));
}

return { mountCalibration };
},

// src\shared\math.js
function clamp(value, min, max) {
  return Math.max(min, Math.min(max, value));

35: () => {
// src\features\control\drive-frequency.js
const RESONANCE_MHZ = 5100;

/** 滑块范围 −100～100；中间 40%（−40～40）覆盖 −25～25 MHz。 */
function detuningFromSlider(position) {
  const distance = Math.abs(position);
  if (distance <= 40) return position * 25 / 40;

  // 与精调区保持斜率连续；三次项让两端逐渐加速，端点为 ±2550 MHz。
  const outerProgress = (distance - 40) / 60;
  const boundarySlope = 25 / 40 * 60;
  const outerDetuning = 25 + boundarySlope * outerProgress
    + (RESONANCE_MHZ / 2 - 25 - boundarySlope) * outerProgress ** 3;
  return Math.sign(position) * outerDetuning;
}

function detuningLabel(detuning) {
  if (Math.abs(detuning) >= 20) return '';
  return `失谐 ${detuning < 0 ? '−' : '+'}${Math.abs(detuning).toFixed(2)} MHz`;
}

return { RESONANCE_MHZ, detuningFromSlider, detuningLabel };
},

const { projectBloch } = loadModule(31);

// 展示开关：设为 false 可关闭轨迹，不影响量子态计算。
const BLOCH_TRAIL_ENABLED = true;

function createBlochTrail(svg, enabled = BLOCH_TRAIL_ENABLED) {
  const group = document.createElementNS('http://www.w3.org/2000/svg','g');
  group.classList.add('bloch-trail');
  group.setAttribute('fill','none');group.setAttribute('stroke','#ffa65c');
  group.setAttribute('stroke-width','1.5');group.setAttribute('stroke-dasharray','2 3');
  group.setAttribute('pointer-events','none');
  svg.insertBefore(group,svg.querySelector('.state-vector'));
  const points=[];
  let elapsed=0,clock=0;
  return {
    update(vector,delta,record=true) {
      if(!enabled)return;
      elapsed+=delta;clock+=delta;
      if(elapsed<.05)return;
      elapsed=0;
      if(record)points.push({...projectBloch(vector),time:clock});
      while(points.length && clock-points[0].time>4)points.shift();
      group.innerHTML=points.slice(1).map((point,i)=>{
        const previous=points[i],opacity=.5*(1-(clock-point.time)/4);
        return `<path d="M${previous.x} ${previous.y}L${point.x} ${point.y}" opacity="${opacity}"/>`;
      }).join('');
    },
    clear(){points.length=0;elapsed=0;clock=0;group.replaceChildren();}
  };
}

return { BLOCH_TRAIL_ENABLED, createBlochTrail };
},

// src\domain\drive-response.js
/** 旋转参考系教学模型：失谐倾斜旋转轴，强度控制动画角速度。 */
function driveAxis(strength, phase, detuning) {
  const transverse=strength/100,z=detuning/60,length=Math.hypot(transverse,z);
  return {x:transverse*Math.cos(phase)/length,y:transverse*Math.sin(phase)/length,z:z/length};
}
/** Rodrigues 旋转：有限脉冲精确停在指定角度，不强制共振。 */
function rotateVector(v,a,angle) {
  const c=Math.cos(angle),s=Math.sin(angle),dot=v.x*a.x+v.y*a.y+v.z*a.z;
  return {x:v.x*c+(a.y*v.z-a.z*v.y)*s+a.x*dot*(1-c),
    y:v.y*c+(a.z*v.x-a.x*v.z)*s+a.y*dot*(1-c),
    z:v.z*c+(a.x*v.y-a.y*v.x)*s+a.z*dot*(1-c)};
}

return { driveAxis, rotateVector };
},

      .sort((a,b)=>Math.hypot(b.x-center.x,b.y-center.y)-Math.hypot(a.x-center.x,a.y-center.y));

    function clear(event){event.preventDefault();event.stopPropagation();if(attack.done)return;attack.done=true;cleared++;button.classList.add('resolved');scene.timeout(()=>button.remove(),120);root.querySelector('#noise-cleared').textContent=cleared;beep(790,.035);}

      const sphere=root.querySelector('[data-qubit-select="'+attack.target+'"] svg').getBoundingClientRect();

39: () => {
// src\domain\statevector.js
/** 五 qubit 状态向量。显示位序始终是 |q0 q1 q2 q3 q4⟩，q0 为最高位。 */
const QUBITS = 5;
const DIMENSION = 1 << QUBITS;
function zeroState() {
  const state = Array.from({
    length: DIMENSION
  }, () => [0, 0]);
  state[0] = [1, 0];
  return state;
}
const multiply = ([a, b], [c, d]) => [a * c - b * d, a * d + b * c];
const add = ([a, b], [c, d]) => [a + c, b + d];
function rotate(state, target, angle, phase = 0) {
  const c = Math.cos(angle / 2),
    s = Math.sin(angle / 2);
  return singleGate(state, target, [[c, 0], [-s * Math.sin(phase), -s * Math.cos(phase)], [s * Math.sin(phase), -s * Math.cos(phase)], [c, 0]]);
}
function singleGate(state, target, matrix) {
  const next = state.map(value => [...value]);
  const mask = 1 << QUBITS - target - 1;
  for (let index = 0; index < DIMENSION; index++) {
    if (index & mask) continue;
    const paired = index | mask;
    next[index] = add(multiply(matrix[0], state[index]), multiply(matrix[1], state[paired]));
    next[paired] = add(multiply(matrix[2], state[index]), multiply(matrix[3], state[paired]));
  }
  return next;
}
function applyOperation(state, operation, fraction = 1) {
  // 同一时刻的一组单比特门；不同目标上的门可交换，逐个计算等价于张量积。
  if (operation.targets) return operation.targets.reduce((next, target) => applyOperation(next, {gate:operation.gate,target}, fraction), state);
  const {
    gate,
    target,
    control
  } = operation;
  if (gate === 'CNOT' || gate === 'CZ') {
    // 中间帧使用受控 Rx / Rz 类插值，仅作为演化可视化；末帧使用精确门。
    const next = state.map(value => [...value]);
    const controlMask = 1 << QUBITS - control - 1;
    const targetMask = 1 << QUBITS - target - 1;
    const c = Math.cos(Math.PI * fraction / 2),
      s = Math.sin(Math.PI * fraction / 2);
    for (let index = 0; index < DIMENSION; index++) {
      if (!(index & controlMask) || index & targetMask) continue;
      const paired = index | targetMask;
      if (gate === 'CZ') {
        next[paired] = multiply(state[paired], [Math.cos(Math.PI * fraction), Math.sin(Math.PI * fraction)]);
      } else if (fraction === 1) {
        next[index] = [...state[paired]];
        next[paired] = [...state[index]];
      } else {
        // exp(-it π/2 (I-X)) 从恒等连续地到达 X，保留条件相位。
        const phase = [c, -s];
        next[index] = multiply(add(multiply([c, 0], state[index]), multiply([0, s], state[paired])), phase);
        next[paired] = multiply(add(multiply([0, s], state[index]), multiply([c, 0], state[paired])), phase);
      }
    }
    return next;
  }
  if (gate === 'X') return rotate(state, target, Math.PI * fraction, 0);
  if (gate === 'Y') return rotate(state, target, Math.PI * fraction, Math.PI / 2);
  if (gate === 'Z' || gate === 'S') {
    const angle = (gate === 'Z' ? Math.PI : Math.PI / 2) * fraction;
    return singleGate(state, target, [[1, 0], [0, 0], [0, 0], [Math.cos(angle), Math.sin(angle)]]);
  }
  if (gate === 'H') {
    const angle = Math.PI * fraction / 2,
      c = Math.cos(angle),
      s = Math.sin(angle) / Math.sqrt(2);
    return singleGate(state, target, [[c, -s], [0, -s], [0, -s], [c, s]]);
  }
  throw new Error('未知量子门：' + gate);
}
function runCircuit(circuit) {
  return circuit.reduce((state, operation) => applyOperation(state, operation), zeroState());
}
function probabilities(state, noise = 0) {
  return state.map(([real, imag]) => (1 - noise) * (real * real + imag * imag) + noise / DIMENSION);
}
function reducedBloch(state, target, noise = 0) {
  const mask = 1 << QUBITS - target - 1;
  let x = 0,
    y = 0,
    z = 0;
  for (let index = 0; index < DIMENSION; index++) {
    if (index & mask) continue;
    const [ar, ai] = state[index],
      [br, bi] = state[index | mask];
    x += 2 * (ar * br + ai * bi);
    y += 2 * (ar * bi - ai * br);
    z += ar * ar + ai * ai - br * br - bi * bi;
  }
  return {
    x: x * (1 - noise),
    y: y * (1 - noise),
    z: z * (1 - noise)
  };
}
function sample(distribution, random = Math.random) {
  const draw = random();
  let sum = 0;
  for (let index = 0; index < distribution.length; index++) {
    sum += distribution[index];
    if (draw < sum) return index;
  }
  return distribution.length - 1;
}
function fidelity(ideal, actual, noise = 0) {
  let real = 0,
    imag = 0;
  for (let i = 0; i < DIMENSION; i++) {
    real += ideal[i][0] * actual[i][0] + ideal[i][1] * actual[i][1];
    imag += ideal[i][0] * actual[i][1] - ideal[i][1] * actual[i][0];
  }
  return (1 - noise) * (real * real + imag * imag) + noise / DIMENSION;
}
function inMeasurementBasis(state, basis) {
  if (basis === 'Z') return state;
  let next = state;
  for (let target = 0; target < QUBITS; target++) {
    if (basis === 'Y') next = singleGate(next, target, [[1, 0], [0, 0], [0, 0], [0, -1]]);
    next = applyOperation(next, {
      gate: 'H',
      target
    });
  }
  return next;
}
function bitstring(value) {
  return value.toString(2).padStart(QUBITS, '0');
}
function describeState(state) {
  const terms = state.map(([real, imag], index) => ({
    real,
    imag,
    index,
    p: real * real + imag * imag
  })).filter(t => t.p > .0001);
  if (terms.length > 8) return terms.length + ' 个基态的相干叠加（展开见概率图）';
  return terms.map(t => '(' + t.real.toFixed(2) + (t.imag < 0 ? '' : ' + ') + t.imag.toFixed(2) + 'i)|' + bitstring(t.index) + '⟩').join(' + ');
}

return { QUBITS, DIMENSION, zeroState, rotate, singleGate, applyOperation, runCircuit, probabilities, reducedBloch, sample, fidelity, inMeasurementBasis, bitstring, describeState };
},

// src\features\control\gate-trajectories.js
const { applyOperation, reducedBloch } = loadModule(39);
const { projectBloch } = loadModule(31);

const SAMPLES = 80;

/** 当前门的未来轨迹，使用与实际演算完全相同的门插值和球面投影。 */
function createGateTrajectories(spheres) {
  const paths=spheres.map(sphere=>{
    const svg=sphere.querySelector('svg');
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.classList.add('gate-future-trail');
    path.setAttribute('fill','none');path.setAttribute('stroke','#ffc078');
    path.setAttribute('stroke-width','2');path.setAttribute('stroke-dasharray','3 3');
    path.setAttribute('opacity','.65');path.setAttribute('pointer-events','none');
    svg.insertBefore(path,svg.querySelector('.state-vector'));
    return path;
  });
  let samples=[],participants=new Set();
  function clear() {
    samples=[];participants.clear();
    paths.forEach(path=>{path.setAttribute('d','');path.removeAttribute('data-progress');});
  }
  return {
    clear,
    prepare(base,operation) {
      clear();
      participants=new Set(operation.targets || [operation.target]);
      if(operation.control!==undefined)participants.add(operation.control);
      samples=Array.from({length:SAMPLES+1},(_,index)=>{
        const state=applyOperation(base,operation,index/SAMPLES);
        return spheres.map((_,q)=>projectBloch(reducedBloch(state,q)));
      });
    },
    update(fraction,state) {
      paths.forEach((path,q)=>{
        if(!participants.has(q)||fraction>=1){path.setAttribute('d','');return;}
        const head=projectBloch(reducedBloch(state,q));
        const remaining=[head,...samples.slice(Math.floor(fraction*SAMPLES)+1).map(sample=>sample[q])];
        path.setAttribute('d',remaining.map((point,i)=>`${i?'L':'M'}${point.x} ${point.y}`).join(' '));
        path.setAttribute('data-progress',fraction);
      });
    }
  };
}

return { createGateTrajectories };
},

    if(search.iteration && search.winner>=0){
      const path=root.querySelector('[data-route="'+selected[brightest]+'"]');
      path.style.filter='drop-shadow(0 0 7px '+routes[selected[brightest]].color+')';path.setAttribute('stroke-width','7');path.parentElement.append(path);
    }
    const max=Math.max(...search.amplitudes.map(a=>a*a));
    root.querySelector('#best-probability').textContent=(max*100).toFixed(1)+'%';
    root.querySelector('#search-description').textContent='已选择 '+selected.length+' / 16 条；搜索 '+search.iteration+' / '+recommended+' 轮。';
    root.querySelector('#path-probabilities').innerHTML=selected.map((id,i)=>'<p>路线 '+(id+1)+'：'+(search.amplitudes[i]**2*100).toFixed(1)+'%</p>').join('');
    root.querySelectorAll('[data-probability-route]').forEach(screen=>{
      const id=Number(screen.dataset.probabilityRoute),index=selected.indexOf(id);
      const probability=index<0?0:search.amplitudes[index]**2;
      screen.querySelector('rect').setAttribute('fill',routes[id].color);
      screen.querySelector('rect').setAttribute('opacity',.05+.95*probability);
      screen.querySelector('text').textContent=`${id+1}: ${Math.round(probability*100)}%`;
    });
  }
  function routeLength(id) {
    return root.querySelector('[data-route="'+id+'"]').getTotalLength();
  }
  function prepare(){
    const count=Number(root.querySelector('#path-count').value);
    selected=shuffle(routes.map(r=>r.index)).slice(0,count).sort((a,b)=>a-b);
    search=createSearch(count,selected.indexOf(MAZE_WINNER));recommended=optimalIterations(count);
    root.querySelector('#search-paths').disabled=false;root.querySelector('#measure-path').disabled=true;root.querySelector('#maze-finish').disabled=true;
    root.querySelector('#maze-traveler').setAttribute('opacity','0');root.querySelector('#maze-markers').innerHTML='';
    root.querySelector('#maze-status').textContent=count+' 条等亮路线已准备';draw();
  }
  root.querySelector('#prepare-paths').addEventListener('click',prepare);
  root.querySelector('#path-count').addEventListener('change',()=>{if(search)prepare();});
  root.querySelector('#search-paths').addEventListener('click',()=>{
    search=searchStep(search);draw();beep(570+search.iteration*90,.06);
    if(search.iteration>=recommended){root.querySelector('#search-paths').disabled=true;root.querySelector('#measure-path').disabled=false;root.querySelector('#maze-status').textContent='搜索结束 · 请测试路径';}
  });
  root.querySelector('#measure-path').addEventListener('click',()=>{
    if(walking)return;
    // 缺解时采用“最长可走距离”演示；有解时仍按量子概率采样。
    const chosen = search.winner < 0
      ? selected.reduce((best, id) => routeLength(id) > routeLength(best) ? id : best)
      : selected[sample(search.amplitudes.map(a => a * a))];
    const route = routes[chosen];
    const path = root.querySelector('[data-route="' + chosen + '"]');
    const dot = root.querySelector('#maze-traveler');
    const distance = path.getTotalLength() - (route.blocked ? 15 : 0);
    const duration = distance / 260 * 1000;
    const start = performance.now();
    walking = true;
    dot.dataset.route = chosen;
    dot.setAttribute('cx',380);
    dot.setAttribute('cy',42);
    dot.setAttribute('opacity','1');
    ['#measure-path','#prepare-paths','#path-count'].forEach(id => root.querySelector(id).disabled = true);
    root.querySelector('#maze-status').textContent = '原子正在测试路线 ' + (chosen + 1);
    function walk(now) {
      const progress = Math.min(1,(now-start)/duration);
      const point = path.getPointAtLength(progress * distance);
      dot.setAttribute('cx',point.x);
      dot.setAttribute('cy',point.y);
      if (progress < 1) {
        scene.frame(walk);
        return;
      }
      walking = false;
      if (route.blocked) {
        root.querySelector('#maze-status').textContent = '碰到障碍 · 原子停止';
        ['#measure-path','#prepare-paths','#path-count'].forEach(id => root.querySelector(id).disabled = false);
        showToast(search.winner < 0 ? '本轮没有出口路线，已测试可走最远的一条。请重新制备。' : '这次测到的路线有障碍，可再次测试。');
      } else {
        root.querySelector('#maze-finish').disabled = false;
        root.querySelector('#maze-status').textContent = '路径验证通过 · 已到出口';
      }
    }
    scene.frame(walk);
  });
  root.querySelector('#maze-finish').addEventListener('click',()=>awardLevel(6,{'叠加制备':100,'搜索策略':100,'路径概率':Math.round(search.amplitudes[search.winner]**2*100)},['量子路径探索者']));
}

return { mount };
},

45: () => {
// src\domain\maze.js
const MAZE_WINNER = 11;
// 同一次加载共用终点位置，避免制备、绘制与试走时障碍发生漂移。
const END_HEIGHTS = Array.from({length:16}, () => 505 + Math.floor(Math.random() * 90));

/** 四层二叉走廊产生固定的 16 条候选路径；只随机选择搜索子空间。 */
function fixedMazeRoutes() {
  return Array.from({length:16},(_,index)=>{
    let path='M380 42',previousY=42;
    for(let depth=1;depth<=4;depth++){
      const prefix=index>>(4-depth),span=720/(2**depth),x=20+span*(prefix+.5),y=65+depth*107;
      path+='V'+(previousY+45)+'H'+x+'V'+y;previousY=y;
    }
    const endX=20+45*(index+.5);
    const blocked = index !== MAZE_WINNER;
    const endY = END_HEIGHTS[index];
    path += 'V' + endY;
    return {index,path,endX,endY,blocked,color:`hsl(${index * 137.5 % 360} 90% 68%)`,exitPath:path};
  });
}

return { MAZE_WINNER, fixedMazeRoutes };
},
46: () => {
// src\domain\search.js
/** 一个已由 oracle 标记的最优候选路线；迭代次数来自 Grover 振幅放大。 */
function createSearch(pathCount, winner) {
  return {
    pathCount,
    winner,
    iteration: 0,
    amplitudes: Array(pathCount).fill(1 / Math.sqrt(pathCount))
  };
}
function searchStep(search) {
  if (search.pathCount === 2 && search.winner >= 0 && search.iteration === 0) {
    // 两候选使用相位匹配：oracle 与 |s><s| 扩散项均取 π/2，得到精确标记态。
    // 去掉公共相位后用实振幅表示；常规 π 相位 Grover 在 N=2 时不能提高概率。
    return {...search, iteration:1, amplitudes:search.amplitudes.map((_,i)=>i===search.winner?1:0)};
  }
  const marked = search.amplitudes.map((value, index) => index === search.winner ? -value : value);
  const average = marked.reduce((sum, value) => sum + value, 0) / search.pathCount;
  return {
    ...search,
    iteration: search.iteration + 1,
    amplitudes: marked.map(value => 2 * average - value)
  };
}
function optimalIterations(count) {
  return Math.max(1, Math.floor(Math.PI / (4 * Math.asin(1 / Math.sqrt(count)))));
}

return { createSearch, searchStep, optimalIterations };
},

    move('.fridge-viewport', stage);
    move('.pressure-instrument', stage);
    move('.temperature-instrument', stage);
    move('#vacuum-message', hud);
    readout('#plate-temperature');
    const rhythm = move('.rhythm-console', dock);
    const buttons = actions(['#pump-start', '#pulse-start', '#vacuum-finish']);
    updates.push(() => {
      currentActions(buttons);
      conceal(rhythm, find('#cooling-tap').disabled);
    });
  } else if (find('#mixture-surface')) {
    workbench.dataset.scene = 'mixture';
    move('.mixture-viewport', stage);
    readout('#mix-readout');
    move('#pair-guide', hud);
    const rate = find('#evap-rate').closest('label'); dock.append(rate);
    const buttons = actions(['#gas-valve', '#condense-start', '#cooling-finish']);
    const single = move('#try-electrons', dock);
    const enterPairing = move('#enter-pairing', dock);
    updates.push(() => {
      const pairing = workbench.dataset.phase === 'pairing';
      conceal(rate, find('#evap-rate').disabled || pairing);
      conceal(enterPairing, find('#evap-rate').disabled || pairing);
      conceal(single, !pairing || !find('#cooling-finish').disabled);
      currentActions(buttons);
    });
  } else if (find('#pulse-canvas')) {
    workbench.dataset.scene = 'calibration';
    move('#pulse-canvas', stage); move('.large-bloch', stage); move('#rabi-readout', hud);
    readout('#match-score');
    source.querySelectorAll('.control-grid').forEach(node => dock.append(node));
    move('#reset-response', dock);
    actions(['#drive-toggle', '#prepare-one', '#prepare-superposition', '#continuous-drive', '#calibration-next']);
    updates.push(() => conceal(find('#calibration-next'), find('#calibration-next').disabled));
  } else if (find('#processor-field')) {
    workbench.dataset.scene = 'processor';
    move('#processor-field', stage); move('.processor-hud', hud);
    const editor = move('.circuit-editor', stage);
    const run = move('#run-algorithm', dock);
    move('#protection-start', dock);
    move('#pure-playback', dock);
    move('#algorithm-result', dock);
    updates.push(() => {
      const running = workbench.dataset.phase === 'running';
      const finished = !find('#algorithm-result').hidden;
      const ready = workbench.dataset.phase === 'ready';
      conceal(editor, ready || running || finished); conceal(run, ready || running || finished);
    });
  } else if (find('#measurement-bars')) {
    workbench.dataset.scene = 'measurement';
    move('.readout-header', stage); move('.measurement-qubits', stage); move('#measurement-bars', stage); move('.chart-legend', stage);
    move('#inference-panel', sheetContent);
    readout('#shot-count');
    readout('#distribution-fidelity');
    actions(['#measure-one', '#measure-batch', '#infer-state', '#readout-finish']);
    scene.listen(dock, 'click', event => { if (event.target.closest('#infer-state')) openSheet('实验结果与量子态推断'); });
    updates.push(() => {
      conceal(find('#infer-state'), find('#infer-state').disabled);
      conceal(find('#readout-finish'), find('#readout-finish').disabled);
    });
  } else if (find('#quantum-maze')) {
    workbench.dataset.scene = 'maze';
    move('.maze-viewport', stage);
    readout('#best-probability');
    move('#path-probabilities', sheetContent);
    const count = find('#path-count').closest('label'); dock.append(count);
    actions(['#prepare-paths', '#search-paths', '#measure-path', '#maze-finish']);
    // 三个操作一直占位；只改变可用状态和高亮，避免每一步切换时跳动。
    updates.push(() => {
      const finish=find('#maze-finish');
      conceal(finish,finish.disabled);
      ['#prepare-paths','#search-paths','#measure-path'].forEach(id=>{
        const button=find(id);
        const current=id==='#prepare-paths'
          ? find('#search-paths').disabled && find('#measure-path').disabled && finish.disabled
          : !button.disabled;
        button.classList.toggle('maze-step-active',current && !button.disabled);
      });
    });
  } else {
    // 用户尚未运行上一关，保留明确的返回操控入口。
    stage.append(...source.childNodes);
  }

  function update() { updates.forEach(render => render()); }
  update();
  // 只观察步骤状态，不监听 SVG 动画和逐帧文字更新。
  const observer = new MutationObserver(update);
  observer.observe(workbench, { subtree: true, attributes: true, attributeFilter: ['disabled', 'hidden', 'data-phase'] });
  scene.onCleanup(() => observer.disconnect());
}

return { mountImmersive };
},

// src\core\test-session.js
const { createProgressStore } = loadModule(2);
const { runCircuit } = loadModule(39);

/** 只写内存的测试存档，不触碰 localStorage，也不改变正常游戏的状态对象。 */
function createTestSession(normalState) {
  let value = JSON.stringify(normalState);
  const store = createProgressStore({
    getItem: () => value,
    setItem: (_, next) => {value = next;},
    removeItem: () => {value = null;}
  });
  store.state.unlocked = 6;
  store.state.sound = false;
  const circuit = [{gate:'H',targets:[0]},...[1,2,3,4].map(target=>({gate:'CNOT',control:0,target}))];
  const state = runCircuit(circuit);
  store.state.experiment = {circuit,ideal:state,actual:state,noise:0,calibrationAccuracy:100,protectionScore:100,stateFidelity:1};
  return store;
}

return { createTestSession };
},
