<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#edf2f5" />
    <meta name="description" content="从晶圆到量子算法：一款面向公众的超导量子计算互动科普游戏。" />
    <title>量子启航实验室</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%237557e8'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' font-family='serif' font-weight='bold' fill='%23ffd75e'%3EQ%3C/text%3E%3C/svg%3E" />
    <style>
:root {
 --ink:#18334a; --muted:#688095; --blue:#246686; --cyan:#168ca2; --gold:#bb914c;
 --paper:#fdfefe; --line:#d2dfe7; --shadow:0 14px 36px #24435c0e;
 font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif; color:var(--ink);
}
* {box-sizing:border-box;}
html {min-height:100%;background:#edf2f5;}
body {margin:0;background:radial-gradient(ellipse at 70% 0,#fff,transparent 55%),linear-gradient(120deg,#f5f7f8,#e9eff3);min-height:100vh;}
button,input,select {font:inherit;}
button {cursor:pointer;-webkit-tap-highlight-color:transparent;}
button:disabled {cursor:default;opacity:.4;}
button:focus-visible,select:focus-visible,input:focus-visible,[role=button]:focus-visible {outline:3px solid #268fa2;outline-offset:4px;}
button:active:not(:disabled) {transform:translateY(1px);}
a {color:#1f7394;}
[hidden] {display:none!important;}
.stars {display:none;}
.topbar {height:82px;max-width:1440px;margin:auto;display:flex;align-items:center;gap:14px;padding:0 32px;border-bottom:1px solid var(--line);}
.brand {display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--ink);text-align:left;}
.brand-mark {display:grid;place-items:center;width:43px;height:43px;border:1px solid #8ba6b6;background:linear-gradient(135deg,#fff,#d7e3eb);box-shadow:inset 0 0 0 4px #edf3f6;font:600 26px Georgia;border-radius:9px;}
.brand b {display:block;font-size:19px;letter-spacing:2px;}
.brand small {display:block;font:10px monospace;letter-spacing:3px;color:var(--muted);margin-top:3px;}
.score-pill {margin-left:auto;display:flex;gap:7px;align-items:center;font:13px monospace;background:#fff9;padding:9px 15px;border:1px solid var(--line);border-radius:6px;}
.score-pill span {color:var(--gold);}
.icon-button {border:1px solid var(--line);background:#fdfefe;color:#325976;width:36px;height:36px;border-radius:6px;}
.level-map {display:flex;max-width:1376px;margin:18px auto 26px;padding:0 24px;gap:12px;}
.level-node {flex:1;min-width:0;border:1px solid #cfdde6;border-radius:6px;background:#f9fcfd;display:flex;gap:10px;align-items:center;padding:13px;color:#7c92a2;box-shadow:inset 0 1px white;}
.level-node b {font:14px monospace;color:#55788f;}
.level-node span {font-size:12px;letter-spacing:1px;}
.level-node.active {background:#1e526e;color:#f3fbff;border-color:#1e526e;box-shadow:0 6px 18px #244a6a20;}
.level-node.active b {color:#aee5eb;}
.level-node.done:not(.active) {border-color:#a3c9c9;color:#306d73;}
#game {max-width:1376px;margin:0 auto;padding:0 24px;outline:0;min-height:600px;}
.footer {max-width:1376px;margin:30px auto 0;padding:23px 24px;display:flex;justify-content:space-between;gap:15px;border-top:1px solid #d1dee6;color:#7f95a5;font-size:11px;}
.text-button {border:0;color:#6c879a;background:none;font-size:11px;}
.toast {position:fixed;z-index:500;left:50%;bottom:25px;max-width:calc(100vw - 36px);padding:14px 22px;border-radius:8px;background:#173d53;color:white;box-shadow:0 8px 35px #12394a33;opacity:0;visibility:hidden;transform:translate(-50%,20px);transition:.2s;font-size:13px;pointer-events:none;}
.toast.show {opacity:1;visibility:visible;transform:translate(-50%,0);}

.lab-home {border:1px solid #cadbe5;background:#fdfefe;border-radius:12px;overflow:hidden;box-shadow:var(--shadow);}
.home-hero {display:grid;grid-template-columns:1.05fr 1fr;min-height:620px;}
.hero-copy {padding:65px 48px;align-self:center;}
.hero-copy .eyebrow {font-size:9px;letter-spacing:1.7px;}
.status-led {display:inline-block;width:6px;height:6px;border-radius:50%;background:#4d9c97;margin-right:8px;}
.hero-copy h1 {font-size:clamp(36px,4.2vw,62px);font-weight:500;letter-spacing:-2px;line-height:1.3;margin:23px 0;}
.hero-copy h1 span {color:#397f99;}
.hero-copy p {font-size:14px;line-height:2.1;color:#7890a1;max-width:410px;}
.home-specs {display:flex;gap:35px;margin:30px 0;color:#7691a3;font:9px monospace;letter-spacing:1px;}
.home-specs b {font:28px monospace;display:block;color:#456a7f;margin-bottom:5px;}
.hero-copy .primary {margin:3px 0 14px;min-width:210px;display:flex;justify-content:space-between;gap:25px;}
.home-note {font-size:10px;color:#90a2ae;}
.home-equipment {position:relative;border-left:1px solid #d5e2e9;background:radial-gradient(ellipse at 50% 40%,white,#e9f0f4);padding:0 25px;}
.home-equipment .fridge-svg {height:620px;min-height:0;}
.equipment-label {position:absolute;top:26px;left:25px;font:9px monospace;letter-spacing:1px;color:#8197a5;}
.equipment-label b {display:block;font-size:26px;font-weight:400;margin-top:6px;color:#658293;}
.equipment-foot {position:absolute;bottom:24px;right:25px;font:10px monospace;color:#7e99aa;}
.experiment-cards {display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #d3e1e9;}
.experiment-card {position:relative;border:0;border-right:1px solid #dce6ec;border-bottom:1px solid #dce6ec;padding:23px;text-align:left;background:#fbfdfe;color:#466579;}
.experiment-card:not(:disabled):hover {background:#edf5f8;}
.experiment-card>span {font:10px monospace;color:#86a0b0;}
.experiment-card h3 {font-size:14px;font-weight:500;margin:13px 0 8px;}
.experiment-card p {font-size:10px;color:#8ca0ad;}
.experiment-card>b {position:absolute;top:24px;right:24px;font-size:18px;font-weight:400;}

.level-cover {height:100%;padding:clamp(20px,4vw,48px);display:flex;flex-direction:column;gap:24px;overflow:auto;background:radial-gradient(circle at 78% 22%,#1b6371 0,#102f40 28%,#07151f 70%);color:#e6f8f6;}
.cover-top {display:flex;justify-content:space-between;gap:16px;color:#8bbbc3;font:12px monospace;letter-spacing:1px;}
.cover-brand {color:#6fe4ce;}
.cover-content {width:min(100%,950px);margin:auto;display:grid;grid-template-columns:1.05fr .95fr;align-items:center;gap:clamp(24px,5vw,80px);}
.cover-heading {position:relative;isolation:isolate;}
.cover-number {position:absolute;z-index:-1;top:-.55em;left:-.12em;color:#ffffff0c;font:clamp(170px,25vw,320px)/1 monospace;pointer-events:none;}
.cover-heading>p {font-size:14px;color:#6fe4ce;letter-spacing:2px;}
.cover-heading h1 {font-size:clamp(34px,5vw,64px);line-height:1.2;margin:20px 0 32px;letter-spacing:2px;}
.cover-process {display:flex;flex-wrap:wrap;gap:9px;}
.cover-process span {display:inline-flex;align-items:center;gap:7px;padding:7px 11px;border:1px solid #57919a66;border-radius:20px;color:#a9d3d5;font-size:12px;}
.cover-process b {color:#6fe4ce;font:12px monospace;}
.cover-story {display:grid;gap:16px;}
.cover-story>div {padding:24px;border:1px solid #5a9ca466;border-left:3px solid #6fe4ce;border-radius:8px;background:#09222dcc;}
.cover-label {font-size:12px;color:#70dbc9;letter-spacing:1px;}
.cover-story p {font-size:clamp(15px,1.6vw,18px);line-height:1.75;margin:12px 0 0;}
.cover-story>div>p:first-child {margin-top:0;}
.cover-actions {width:min(100%,950px);margin:0 auto;display:flex;justify-content:flex-end;gap:12px;}
.cover-actions button {min-height:48px;padding:10px 24px;border-radius:6px;}
.cover-actions .primary {background:#5cdec3;border:1px solid #8afce0;color:#063638;}
.cover-actions .secondary {background:#163443;border:1px solid #4b7787;color:#aad6db;}
@media(max-width:700px) {
  .level-cover {gap:16px;padding:20px 18px max(20px,env(safe-area-inset-bottom));}
  .cover-top {font-size:10px;}
  .cover-content {display:block;}
  .cover-heading h1 {margin:12px 0 20px;}
  .cover-number {top:-.45em;font-size:180px;}
  .cover-story {gap:10px;margin-top:28px;}
  .cover-story>div {padding:15px 17px;}
  .cover-story p {font-size:14px;margin-top:7px;}
  .cover-actions {display:grid;grid-template-columns:1fr 1fr;}
  .cover-actions button {padding:8px;}
}

.eyebrow {font:10px/1.6 monospace;letter-spacing:2px;color:#6f8c9f;display:block;margin-bottom:12px;}
.level-head {display:flex;align-items:center;justify-content:space-between;padding:7px 0 24px;}
.level-head h1 {font-size:30px;font-weight:600;letter-spacing:1px;margin:0;}
.level-head p {font-size:12px;color:var(--muted);letter-spacing:1px;margin:9px 0 0;}
.step-pills {display:flex;gap:6px;align-items:center;}
.step-pills span {height:4px;width:25px;background:#d2dfe7;border-radius:5px;}
.step-pills span.active {background:#50869f;}
.step-pills small {margin-left:9px;font:11px monospace;color:var(--muted);}
.mission {display:flex;flex-direction:column;gap:4px;font-size:12px;line-height:1.7;padding:15px 19px;background:#e1ecf28f;border:1px solid #c7d9e3;border-left:3px solid #5d8fa8;border-radius:5px;margin-bottom:21px;}
.mission-summary {margin:0;color:#58788c;}
.workbench {position:relative;background:#fefeff;border:1px solid #cbdbe5;border-radius:12px;box-shadow:0 18px 55px #23465c10,0 2px 4px #23465c06;overflow:hidden;}
.instrument-head {display:flex;justify-content:space-between;gap:18px;align-items:center;padding:23px 25px;border-bottom:1px solid #dce7ed;background:linear-gradient(180deg,#fff,#f6f9fb);}
.instrument-head .eyebrow {font-size:9px;margin:0 0 8px;color:#60869d;}
.instrument-head h2 {font-size:19px;font-weight:500;margin:0;letter-spacing:1px;}
.live-badge {flex-shrink:0;font:9px/1.8 monospace;letter-spacing:1px;padding:6px 10px;border:1px solid #b9d1d8;border-radius:4px;background:#ebf4f5;color:#4a7e87;}
.live-badge::before {content:'';display:inline-block;width:5px;height:5px;background:#5a9f9a;border-radius:50%;margin-right:6px;}
.bench-grid {display:grid;grid-template-columns:minmax(0,1fr) 285px;align-items:stretch;}
.viewport {position:relative;min-width:0;overflow:hidden;background:radial-gradient(ellipse at 45% 35%,#fff,#edf3f7);border-right:1px solid #dce7ed;}
.viewport::before {position:absolute;content:'';pointer-events:none;inset:14px;border:1px solid #bdcdd65c;border-radius:2px;z-index:2;}
.viewport-caption {position:relative;text-align:center;font-size:10px;line-height:1.6;color:#7792a5;letter-spacing:.5px;padding:10px 15px 18px;}
.svg-label {font-family:monospace,"Microsoft YaHei",sans-serif;font-size:12px;fill:#597c92;}
.control-panel {padding:24px;background:linear-gradient(115deg,#fcfdfe,#f1f6f9);min-width:0;}
.control-panel h3 {font-size:13px;font-weight:600;letter-spacing:1px;margin:0 0 16px;color:#365a73;}
.control-panel p {font-size:12px;line-height:1.8;color:#6b8495;}
.primary,.secondary {min-height:43px;border:1px solid #225a78;padding:11px 17px;border-radius:5px;font-size:12px;font-weight:500;letter-spacing:.5px;}
.primary {background:linear-gradient(180deg,#327a96,#205670);color:white;box-shadow:inset 0 1px #78afbe55,0 3px 6px #17466019;}
.primary:hover:not(:disabled) {background:#286a85;}
.secondary {background:linear-gradient(#fff,#ecf2f5);color:#496f85;border-color:#b9cdd9;}
.control-panel>.primary,.control-panel>.secondary {width:100%;margin-top:10px;}
.tool-button {width:100%;text-align:left;display:block;padding:14px;margin:0 0 9px;border:1px solid #cddce5;border-radius:6px;background:#fcfeff;color:#456b82;box-shadow:0 2px 4px #173e5507;}
.tool-button b {display:block;font-size:12px;font-weight:600;}
.tool-button span {display:block;margin-top:8px;font-size:10px;line-height:1.7;color:#8198a7;}
.tool-button.selected {border-color:#4d97ac;background:#e5f2f5;box-shadow:inset 3px 0 #5095ac;}
.readout {display:flex;flex-direction:column;gap:10px;margin:22px 0;padding:17px 0;border-top:1px solid #d6e2e9;border-bottom:1px solid #d6e2e9;}
.readout small {font-size:11px;letter-spacing:1px;color:#7b92a2;}
.readout strong {font:500 32px/1.1 "Consolas",monospace;color:#285a72;letter-spacing:-1px;}
.readout em {font:12px monospace;color:#6b8ba1;font-style:normal;}
.readout>span {font-size:11px;line-height:1.7;color:#7390a2;}
.readout.horizontal {flex-direction:row;align-items:center;justify-content:space-between;}
.meter {height:5px;border-radius:5px;background:#dde9f0;margin-bottom:18px;overflow:hidden;}
.meter span {display:block;height:100%;background:linear-gradient(90deg,#447e9c,#63b6ba);width:0;transition:width .2s;}
.science-note {font-size:11px!important;line-height:1.9!important;color:#8095a3!important;margin:18px 0 0;padding-top:13px;border-top:1px solid #dce6ec;}
.workbench>.science-note {padding:18px 26px;margin:0;background:#f6fafc;border-top:1px solid #d4e2e9;}
.instrument-panel {padding:23px;min-width:0;background:#f8fbfc;border:1px solid #d8e5ec;border-radius:8px;}
.panel-label {font:10px monospace;color:#65869b;letter-spacing:1px;margin-bottom:18px;}
.control-grid {display:grid;grid-template-columns:1fr 1fr;gap:15px;}
.range-control,.select-control {display:block;font-size:12px;color:#54788d;line-height:1.7;margin:10px 0;}
.range-control output {display:block;font:12px monospace;color:#2c6783;margin:6px 0;}
input[type=range] {width:100%;accent-color:#3c8b9e;min-height:28px;}
select {background:#fff;border:1px solid #c3d6e1;color:#2e5d77;padding:8px;border-radius:4px;max-width:100%;}
.workbench-actions {display:flex;gap:12px;flex-wrap:wrap;padding:21px 25px;}
.fridge-svg {display:block;width:100%;max-height:860px;min-height:500px;}
.stage-temp {fill:#51788e;font:12px monospace;}
.fridge-shell {opacity:0;transform:translateY(-850px);transition:transform 1.2s cubic-bezier(.2,.7,.2,1),opacity .4s;}
.fridge-svg.sealed .fridge-shell {opacity:1;transform:translateY(0);}
.fridge-svg .plate-top {transition:fill .7s;}
.sources-panel {padding:23px;font-size:12px;line-height:1.9;color:#7690a2;}
.sources-panel summary {cursor:pointer;}

.wafer-viewport svg {display:block;width:100%;min-height:430px;touch-action:none;}
.stain {transition:opacity .12s;pointer-events:none;}
#cleaning-nozzle {filter:drop-shadow(0 0 6px #91d8e955);}
.chip-viewport {padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;}
#trace-surface {display:block;width:100%;height:490px;background:#142034;border:12px solid #e0e8ee;border-radius:7px;box-shadow:0 2px 18px #193b501a;touch-action:none;}
.chip-viewport .viewport-caption {margin-top:14px;}
.chip-drawing {display:block;width:100%;height:auto;}
.process-viewport {min-height:470px;}
#process-chip {position:relative;width:100%;display:block;}
.exposure-beam {position:absolute;inset:15% 6%;background:linear-gradient(90deg,transparent,#a797fd88,transparent);opacity:0;pointer-events:none;}
.exposing .exposure-beam {animation:expose 1.2s ease;}
.etch-scan {position:absolute;left:8%;right:8%;height:4px;top:20%;opacity:0;background:#a7ffff;box-shadow:0 0 24px #56d3e1;pointer-events:none;}
.etch-scan.scanning {animation:etch .4s ease;}
@keyframes expose {0%,100% {opacity:0;}50% {opacity:1;}}
@keyframes etch {0% {opacity:0;top:20%;}30%{opacity:1;}100%{opacity:0;top:75%;}}
.packaging-viewport {display:flex;align-items:center;min-height:500px;}
#package-surface {display:block;width:100%;}
.chip-tray-real {width:100%;border:1px solid #bbcfdc;border-radius:6px;background:linear-gradient(#f4f8fa,#d8e5ed);padding:12px;touch-action:none;cursor:grab;}
.chip-tray-real span {font-size:10px;color:#7891a2;display:block;margin-top:9px;}
.chip-tray-real.dragging {opacity:.6;outline:2px solid #55a2b4;cursor:grabbing;}
.bond-pad {fill:#d6b25b;stroke:#927034;stroke-width:1;cursor:pointer;}
.bond-pad.selected {stroke:#00aca6;stroke-width:4;}
.bond-pad.bonded {fill:#7aa28d;}
.bond-wire {filter:drop-shadow(1px 3px 2px #1d190b66);stroke-dasharray:100;stroke-dashoffset:0;animation:bond-draw .7s linear;}
@keyframes bond-draw {from {stroke-dashoffset:100;}}
#package-lid.lowering {animation:lower-lid 1s ease;}
@keyframes lower-lid {from {transform:translateY(-320px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.lid-screw {cursor:pointer;}
.lid-screw circle {fill:#dbe4e9;stroke:#597686;stroke-width:3;}
.lid-screw path {stroke:#557080;stroke-width:2;transition:transform .5s;}
.lid-screw.tight path {transform:rotate(135deg);}
.lid-screw.tight circle {fill:#9fc7b9;}

/* 指针只操控实验工具，不选取 SVG 文本，也不触发浏览器图片拖动。 */
#cleaning-surface,#trace-surface,#package-surface,.direction-pad,.chip-tray-real {
 user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
#cleaning-surface {touch-action:none;max-height:430px;}
#cleaning-surface text {pointer-events:none;}
.spray-rings {opacity:0;}
.cleaning-active .spray-rings {opacity:1;transform-origin:0 0;animation:cleaning-flow .9s linear infinite;}
@keyframes cleaning-flow {
  0% {transform:translate(-85px,-85px);opacity:0;}
  20%,70% {opacity:.85;}
  100% {transform:translate(65px,65px);opacity:0;}
}
@keyframes spray {from {transform:scale(.5);opacity:1;}to {transform:scale(1.3);opacity:0;}}
.stain.cleaned {filter:drop-shadow(0 0 10px #efffff);}
.laser-viewport {padding:16px;}
#trace-surface {height:350px;max-width:460px;border-width:5px;}
.laser-guide path {fill:none;stroke:#60cae9;stroke-width:2;stroke-dasharray:4 4;opacity:.65;}
.laser-ink {fill:none;stroke:#88f5ed;stroke-width:3;stroke-linejoin:round;filter:drop-shadow(0 0 3px #44e6e2);}
.firing .laser-halo {animation:spray .35s linear infinite;}
.laser-controls {text-align:center;width:100%;padding-top:12px;}
#laser-hint {font-size:14px;color:#2f627a;display:block;min-height:22px;}
.direction-pad {display:grid;grid-template-columns:repeat(3,56px);grid-template-rows:repeat(3,48px);justify-content:center;gap:5px;margin:10px auto 0;touch-action:none;}
.direction-pad button {border:1px solid #9bb6c5;border-radius:12px;background:linear-gradient(#fff,#dce9f0);color:#315c70;font-size:25px;box-shadow:0 3px 0 #b4c9d3;touch-action:none;}
.direction-pad [data-direction=ArrowUp] {grid-column:2;grid-row:1;}
.direction-pad [data-direction=ArrowLeft] {grid-column:1;grid-row:2;}
.direction-pad [data-direction=ArrowRight] {grid-column:3;grid-row:2;}
.direction-pad [data-direction=ArrowDown] {grid-column:2;grid-row:3;}
.direction-pad span {grid-column:2;grid-row:2;align-self:center;color:#45a7bb;}
.direction-pad button.next-direction {background:#d8fbef;border:2px solid #23a583;box-shadow:0 3px 0 #78bdab;}
.direction-pad button:active {transform:translateY(2px);box-shadow:none;}
.junction-inset {margin-top:16px;color:#50768c;font-size:13px;}
.junction-inset svg {display:block;width:100%;max-width:360px;margin:auto;}
.process-viewport {min-height:0;padding:24px;}
#resist-film,#develop-windows,#etched-pattern,#exposed-pattern,#etch-underlay {transition:opacity .45s;}
#resist-film.removed {opacity:0;transition:opacity .8s;}
.process-buttons {display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.process-buttons .tool-button {text-align:center;min-height:52px;}
.packaging-viewport {min-height:0;padding:24px;}
#package-surface {max-height:540px;touch-action:manipulation;}
.bond-pad .pad-metal {fill:#e8c77c;stroke:#95743b;stroke-width:1;}
.bond-pad .pad-hit {fill:transparent;stroke:none;}
.bond-pad .pad-ring {stroke:transparent;stroke-width:2;}
.bond-pad.suggested .pad-ring {stroke:#3bd9b1;animation:pad-pulse 1s ease-in-out infinite;}
.bond-pad.selected .pad-metal {stroke:#36bca5;stroke-width:3;}
.bond-pad.bonded .pad-metal {fill:#afd0b8;}
.bond-pad text {pointer-events:none;}
.bond-pad:focus {outline:none;}
.bond-pad:focus-visible .pad-ring {stroke:#2479b1;stroke-width:4;}
@keyframes pad-pulse {50% {stroke-width:5;opacity:.5;}}
.chip-tray-real {max-width:240px;}

.installation-layout {display:grid;grid-template-columns:215px minmax(360px,1fr) 245px;}
.installation-layout .control-panel {padding:18px;}
.installation-layout .fridge-viewport {border-left:1px solid #dce7ed;}
.inventory-part {width:100%;display:flex;gap:11px;align-items:center;padding:12px 8px;border:1px solid #c4d5e0;background:linear-gradient(115deg,#fff,#edf3f6);border-radius:5px;margin:9px 0;text-align:left;min-height:67px;}
.inventory-part b {font-size:11px;color:#4b6e83;font-weight:500;}

/* 固定视口游戏壳：舞台自适应剩余高度，操作区保持可触摸尺寸。 */
html {background:#07131e;}
body {background:#07131e;color:#d7e9ef;}
body>.topbar,body>.footer {display:none;}
body #game {min-height:0;max-width:1200px;padding:0;}
.launch-screen {height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;position:relative;overflow:hidden;background:radial-gradient(ellipse,#184051,#06121c 70%);text-align:center;padding:24px 16px max(20px,env(safe-area-inset-bottom));}
.launch-heading {z-index:1;}
.launch-heading>span {color:#5ddec8;letter-spacing:3px;font-size:10px;}
.launch-heading h1 {font-size:32px;margin:12px 0;color:#e1faf4;letter-spacing:3px;}
.launch-heading p {font-size:12px;color:#90bcca;margin:6px 0;}
.launch-equipment {min-height:0;position:relative;}
.launch-equipment .fridge-svg {height:100%;width:100%;min-height:0;max-height:none;}
.launch-equipment .stage-temp {fill:#92c8d7;}
.launch-actions {display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:500px;width:100%;margin:auto;}
.launch-actions button {min-height:48px;flex:1;min-width:130px;}
.launch-actions .primary {background:#5cdec3;border:1px solid #8afce0;color:#063638;}
.launch-actions .secondary {background:#163443;border-color:#4b7787;color:#aad6db;}
.launch-actions small {flex-basis:100%;font-size:11px;color:#749eab;}
body.playing {height:100dvh;overflow:hidden;overscroll-behavior:none;}
body.playing>.topbar,body.playing>.footer {display:none;}
body.playing #game {height:100dvh;min-height:0;max-width:1200px;padding:0;margin:auto;}
body.playing .level-shell {height:100%;max-width:none;display:grid;grid-template-rows:52px auto minmax(0,1fr);padding-top:env(safe-area-inset-top);}
body.playing .level-head {padding:4px 10px;gap:10px;background:#0c1d29;border-bottom:1px solid #234451;justify-content:flex-start;}
body.playing .level-head h1 {font-size:16px;color:#e2f6f5;letter-spacing:0;}
body.playing .level-head .eyebrow,body.playing .level-head p {display:none;}
body.playing .step-pills {margin-left:auto;gap:4px;}
body.playing .step-pills span {width:12px;background:#2b4c57;}
body.playing .step-pills span.active {background:#49ddc7;}
body.playing .step-pills small {font-size:11px;color:#a5cccd;}
.hud-button {flex:none;min-width:44px;height:44px;border:0;border-radius:8px;background:transparent;color:#68e3d2;font-size:21px;}
body.playing .mission {border:0;border-radius:0;background:#10242e;padding:5px 12px;margin:0;min-height:0;font-size:12px;line-height:1.5;}
body.playing .mission-summary {color:#a8d3d8;}
body.playing .workbench {min-height:0;display:grid;grid-template-rows:minmax(0,1fr) auto;background:#081923;border:0;border-radius:0;box-shadow:none;overflow:hidden;}
.stage-main {display:grid;grid-template-rows:minmax(0,1fr) auto;min-height:0;position:relative;background:radial-gradient(ellipse at 50% 40%,#173b4c 0%,#0b202c 55%,#08151f 100%);}
.stage-main::before {content:'';position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(#4385980c 1px,transparent 1px),linear-gradient(90deg,#4385980c 1px,transparent 1px);background-size:40px 40px;}
.stage-art {min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
.stage-art>.viewport {width:100%;height:100%;min-height:0;padding:8px;background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.stage-art .viewport::before {display:none;}
.stage-art .viewport>svg {display:block;width:100%;height:100%;min-height:0;max-height:none;flex:1;min-width:0;}
.stage-art .svg-label,.stage-art .stage-temp {fill:#99c0cd;}
.stage-art .viewport-caption {display:none;}
.stage-art .process-viewport .viewport-caption {display:block;flex:none;color:#a8d8d9;font-size:12px;padding:4px 8px;margin:0;}
.stage-art #cleaning-surface {min-height:0;max-height:none;}
.stage-art #trace-surface {height:100%;width:100%;max-width:none;max-height:none;border:0;background:transparent;box-shadow:none;}
.stage-art #package-surface {max-height:none;}
.stage-art #process-chip {flex:1;min-height:0;}
.stage-hud {position:relative;display:flex;align-items:center;justify-content:center;gap:6px 18px;flex-wrap:wrap;padding:8px 14px;background:#071620cc;border-top:1px solid #37596a55;pointer-events:none;}
.stage-hud .readout {margin:0;padding:0;border:0;display:flex;flex-direction:row;align-items:baseline;gap:7px;flex-wrap:wrap;}
.stage-hud .readout small {font-size:10px;color:#8fb7c4;letter-spacing:0;}
.stage-hud .readout strong {font-size:19px;line-height:1.2;color:#70e8d3;letter-spacing:0;white-space:nowrap;}
.stage-hud .readout>span {font-size:11px;color:#bbd4dc;line-height:1.4;flex-basis:100%;}
.stage-hud .scene-status {font-size:9px;background:#15313b;border:1px solid #2c5f67;color:#81cabf;max-width:170px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;order:5;padding:4px 6px;}
.stage-hud p,.stage-hud #rabi-readout {font-size:12px;color:#bde2e1;margin:0;padding:0;line-height:1.5;}
.stage-hud #package-hint,.stage-hud #pair-guide {flex-basis:100%;text-align:center;}
.action-dock.control-panel {position:relative;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;min-height:66px;padding:10px 12px max(10px,env(safe-area-inset-bottom));background:linear-gradient(#102833,#0c1c26);border-top:1px solid #346274;min-width:0;}
.action-dock.control-panel>button {flex:1;min-width:0;width:auto;margin:0;min-height:44px;line-height:1.3;}
.action-dock .tool-button {display:block;text-align:center;padding:10px;margin:0;min-height:46px;background:#143440;border:1px solid #386879;color:#bfdee1;box-shadow:none;}
.action-dock .tool-button span {display:none;}
.action-dock .tool-button.selected {background:#174b4d;border-color:#4bdac0;color:#a8ffdc;box-shadow:inset 0 -3px #4bdac0;}
.action-dock .tool-button b {font-size:13px;}
.action-dock .primary {color:#062f31;background:linear-gradient(#75ead0,#46cbbd);border-color:#68e1c8;box-shadow:none;font-size:13px;padding:10px;}
.action-dock .secondary {color:#b2d6dd;background:#16323e;border-color:#416272;font-size:13px;padding:10px;}
.action-dock button:disabled {opacity:.35;}
.scene-concealed {display:none!important;}
.action-dock .range-control,.action-dock .select-control {color:#acd2db;font-size:12px;margin:0;}
.action-dock select {color:#d1eae7;background:#163844;border-color:#436674;min-height:44px;}
.action-dock input[type=range] {accent-color:#58dbbf;min-height:28px;margin:0;touch-action:pan-x;}
.action-dock .range-control output {color:#6edcca;font-size:11px;margin:0;display:inline;float:right;}
.action-dock .range-control {width:100%;}
.action-dock .control-grid {display:grid;grid-template-columns:1fr 1fr;width:100%;gap:16px;}
.action-dock .control-grid label {width:auto;}
.action-dock .laser-controls {padding:0;width:auto;}
[data-scene=laser] .action-dock {display:grid;grid-template-columns:170px minmax(0,1fr);gap:12px;}
[data-scene=laser] .direction-pad {margin:4px auto 0;}
[data-scene=laser] #laser-hint {height:32px;min-height:32px;display:flex;justify-content:center;align-items:center;font-size:11px;}
[data-scene=laser] #trace-next {max-width:260px;justify-self:center;}
.action-dock #laser-hint {font-size:12px;color:#a7ece1;min-height:18px;}
.action-dock .direction-pad {grid-template-columns:repeat(3,50px);grid-template-rows:repeat(3,44px);gap:3px;margin:4px 0 0;}
.action-dock .direction-pad button {font-size:24px;border-radius:8px;box-shadow:none;background:#193845;color:#aacdd5;border-color:#376270;}
.action-dock .direction-pad button.next-direction {background:#286a63;color:#c4ffe7;border-color:#6bf7cf;}
.action-dock .chip-tray-real {max-width:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:4px 12px;background:#17313e;border:1px solid #3a6a78;}
.action-dock .chip-tray-real svg {width:72px;height:46px;}
.action-dock .chip-tray-real span {font-size:12px;color:#b9dddd;max-width:180px;margin:0;}
.action-dock .rhythm-console {width:100%;margin:0;display:grid;grid-template-columns:1fr 115px;gap:8px;align-items:center;padding:0;border:0;}
.action-dock .rhythm-console>small {display:none;}
.action-dock .rhythm-rail {margin:0;height:22px;}
.action-dock #cooling-tap {margin:0;min-height:44px;}
.stage-art .mixture-viewport>.junction-inset {display:none;}
[data-scene=mixture][data-phase=pairing] .mixture-viewport>#mixture-surface {flex:0 1 32%;height:32%;opacity:.6;}
[data-scene=mixture][data-phase=pairing] .stage-art .junction-inset {display:flex;flex:1;min-height:0;width:100%;flex-direction:column;margin:0;padding:8px;background:transparent;border:0;color:#a1d7d8;}
.stage-art .junction-inset .inset-head {font-size:11px;color:#a1d7d8;}
.stage-art .junction-inset svg {width:100%;height:100%;max-width:none;min-height:0;flex:1;}
[data-scene=calibration] .stage-art {padding:8px 20px;}
.stage-art #pulse-canvas {width:100%;height:30%;max-width:650px;object-fit:contain;margin:0;border:1px solid #446675;border-radius:4px;flex:none;}
.stage-art .large-bloch {flex:1;min-height:0;width:100%;max-width:none;margin:0;}
.stage-art .large-bloch svg {height:100%;max-width:100%;margin:auto;}
.stage-art .bloch-sphere text {fill:#a7cbd0;}
.stage-art .bloch-sphere .state-vector {stroke:#60eed7;}
.stage-art .bloch-sphere .state-dot {fill:#a4ffde;}
.stage-art #processor-field {width:100%;height:100%;min-height:0;padding:12px;}
.stage-art .qubit-array {height:100%;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:10px;}
.stage-art .qubit-unit {background:linear-gradient(135deg,#163442,#0c2330);border:1px solid #375c6a;padding:6px;min-height:0;display:flex;flex-direction:column;color:#c5e7e7;}
.stage-art .qubit-unit.selected {border-color:#5ae5c9;box-shadow:0 0 16px #2bbfa620;}
.stage-art .qubit-unit:last-child {grid-column:1/-1;max-width:calc(50% - 5px);width:100%;justify-self:center;}
.stage-art .qubit-unit .bloch-sphere {height:100%;min-height:0;max-height:none;flex:1;}
.stage-art .qubit-unit-label {font-size:12px;padding:0;}
.stage-art .qubit-unit-label span {display:none;}
.stage-art .qubit-unit>small {font-size:9px;color:#87bfca;white-space:normal;}
.stage-hud .processor-hud {margin:0;padding:0;border:0;color:#9ccdd2;background:none;font-size:11px;}
.action-dock #algorithm-result {width:100%;padding:0;margin:0;background:none;border:0;text-align:center;}
.action-dock #algorithm-result h3 {display:none;}
.action-dock #algorithm-result p {font-size:11px;color:#9acbd0;margin:0 0 6px;}
.stage-art .noise-event {max-width:40%;font-size:11px;min-height:44px;}
.stage-art .measurement-bars {width:100%;height:100%;min-height:0;max-height:none;overflow:auto;background:#0d2632;border:0;padding:16px;}
.stage-art .readout-header {flex:none;display:flex;align-items:center;flex-direction:column;gap:10px;padding:18px 10px;color:#91c4cb;font-size:12px;}
.stage-art .readout-header strong {font:32px monospace;color:#78efcf;}
.stage-art .chart-legend {flex:none;color:#9fc9ce;font-size:11px;padding:8px;}
.stage-art .probability-row {font-size:11px;color:#a8d1da;min-height:26px;}
.stage-art .probability-track {background:#1e3b46;}
.stage-hud .readout-header {margin:0;padding:0;flex-direction:row;gap:12px;align-items:center;color:#a3cdd3;font-size:11px;}
.stage-hud .readout-header strong {font-size:20px;color:#70ecd1;}
[data-scene=measurement] .action-dock>button {flex-basis:38%;}
[data-scene=measurement] .action-dock>.select-control {flex-basis:100%;text-align:center;}
[data-scene=measurement] .stage-hud .scene-status {display:none;}
.stage-art #quantum-maze {min-height:0;}
.stage-art .route-cost {fill:#a6c8d1;font-size:12px;}
[data-scene=maze] .action-dock>button {flex-basis:35%;}
[data-scene=maze] .action-dock .select-control {flex-basis:100%;text-align:center;}
[data-scene=maze] .action-dock>#scene-tools-open {flex:0 0 auto;order:-1;min-width:90px;}
[data-scene=maze] .action-dock .select-control {flex:1;order:-2;font-size:11px;}
.stage-art .placement-guide .slot-body {stroke:#80ffca;stroke-width:5;filter:drop-shadow(0 0 9px #58e6ba);}

/* 只有按需打开的资料/设置面板可以内部滚动；主页面保持一屏。 */
.scene-sheet {color:#284c62;background:#f1f7f9;border:1px solid #6192a4;border-radius:16px;padding:0;width:min(94vw,680px);max-height:88dvh;overflow:auto;box-shadow:0 25px 100px #0009;}
.scene-sheet::backdrop {background:#03131bbd;backdrop-filter:blur(5px);}
.scene-sheet>header {display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:10;padding:8px 16px;background:#e2eff3;border-bottom:1px solid #bcd1db;}
.scene-sheet>header b {font-size:15px;}
.scene-sheet>header button {min-width:44px;min-height:44px;border:0;background:none;color:#31596b;font-size:20px;}
.scene-sheet .sheet-content {padding:16px;font-size:14px;line-height:1.7;}
.scene-sheet .science-help {margin:0;}
.scene-sheet .sheet-content>.primary,.scene-sheet .sheet-content>.secondary {margin-top:12px;}
.scene-sheet .inventory {display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0;background:none;}
.scene-sheet .inventory h3,.scene-sheet .inventory>p {grid-column:1/-1;}
.scene-sheet .inventory-part {min-height:64px;margin:0;}
.scene-sheet .level-map {padding:12px;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;overflow:visible;}
.scene-sheet .level-node {flex-direction:row;min-height:52px;}
.menu-settings {display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:16px;}
.menu-settings .score-pill {margin:0;}
.menu-settings .icon-button {width:44px;height:44px;}
.menu-settings .text-button {min-height:44px;}
.scene-sheet .circuit-editor {padding:0;}
.scene-sheet .circuit-scroll {max-height:200px;}
.scene-sheet .circuit-editor .workbench-actions {padding:10px 0;}
.scene-sheet .inference-panel {margin:0;border:0;padding:0;}
.scene-sheet .path-probabilities {max-height:none;}
.scene-sheet .gate-button {min-width:44px;min-height:44px;}
.playing .toast {bottom:calc(90px + env(safe-area-inset-bottom));}
.showing-result #game {min-height:0;}
.showing-result .complete-card {width:min(750px,calc(100% - 24px));margin:10px auto;padding:24px;}
.showing-result .footer {display:none;}
@media(max-height:700px) {
 .stage-art .qubit-array {grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));}
 .stage-art .qubit-unit:last-child {grid-column:auto;max-width:none;}
 body.playing .level-shell {grid-template-rows:46px auto minmax(0,1fr);}
 body.playing .mission {padding:4px 10px;font-size:12px;min-height:0;}
 .action-dock.control-panel {padding-top:6px;padding-bottom:max(6px,env(safe-area-inset-bottom));gap:5px;}
 .stage-hud {padding:5px 10px;gap:4px 10px;}
 .stage-hud .scene-status {display:none;}
 .stage-hud .readout>span {font-size:10px;}
 .action-dock .direction-pad {grid-template-rows:repeat(3,44px);}
 .action-dock .control-grid {gap:10px;}
 .action-dock .range-control output {font-size:10px;}
 .action-dock .range-control {font-size:11px;}
 .action-dock .range-control input {min-height:24px;}
}
@media(min-width:1000px) {
 .stage-art .qubit-array {grid-template-columns:repeat(5,minmax(0,1fr));grid-template-rows:minmax(0,1fr);align-items:center;}

@media(max-width:380px) {
 body.playing .level-head h1 {font-size:14px;}

 .stage-art .qubit-unit>small {font-size:8px;}
}
@media(min-width:700px) and (max-height:500px) {
 [data-scene=laser] .action-dock {grid-template-columns:260px 1fr;}
 [data-scene=laser] .direction-pad {grid-template-columns:repeat(4,50px);grid-template-rows:44px;}
 [data-scene=laser] .direction-pad [data-direction=ArrowLeft] {grid-column:1;grid-row:1;}
 [data-scene=laser] .direction-pad [data-direction=ArrowUp] {grid-column:2;grid-row:1;}
 [data-scene=laser] .direction-pad [data-direction=ArrowDown] {grid-column:3;grid-row:1;}
 [data-scene=laser] .direction-pad [data-direction=ArrowRight] {grid-column:4;grid-row:1;}
 [data-scene=laser] .direction-pad span {display:none;}
 [data-scene=calibration] .action-dock .control-grid {width:calc(50% - 8px);}
 [data-scene=calibration] .action-dock>button {flex-basis:40%;}
 [data-scene=calibration] .stage-art {flex-direction:row;}
 [data-scene=calibration] .stage-art #pulse-canvas {width:50%;height:90%;}
 [data-scene=calibration] .stage-art .large-bloch {height:100%;}
 .stage-hud .readout>span {flex-basis:auto;}
}

.action-dock.control-panel button,.scene-sheet button {font-size:15px;min-height:44px;}
.playing .level-head button {font-size:15px;}
.action-dock .range-control,.action-dock .range-control output {font-size:13px;}

.stage-art {position:relative;}

.floating-pressure small,.floating-pressure span {display:block;font-size:12px;}

.action-dock .rhythm-rail {height:34px;margin:5px 0;}
.rhythm-target {background:#36dba78a;border:3px solid #b0ffe3;}
#cooling-beat {top:6px;background:#ffcf63;border-color:white;}
.cycle-label {fill:#e0f5f5;font:24px sans-serif;}
.cycle-label.small {font-size:21px;}
.heat-label {fill:#ffbe7d;}
.valve-panel {text-align:center;}
.valve-panel>svg {display:block;width:200px;max-height:28dvh;margin:auto;}
.valve-buttons {display:flex;gap:12px;justify-content:center;}

  <body>
    <div class="stars" aria-hidden="true"></div>
    <header class="topbar">
      <button class="brand" id="home-button" aria-label="返回实验室主页">
        <span class="brand-mark">Q</span>
        <span><b>量子启航</b><small>Quantum Lab</small></span>
      </button>
      <div class="score-pill" aria-label="当前总星数"><span>★</span><b id="total-stars">0</b><small>/ 18</small></div>
      <button class="icon-button" id="sound-button" aria-label="开关音效">♪</button>
    </header>

    <nav class="level-map" id="level-map" aria-label="关卡进度"></nav>
    <main id="game" tabindex="-1"></main>

    <footer class="footer">
      <button class="text-button" id="reset-button">重置进度</button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script>
(() => {
  'use strict';
  const factories = {
0: () => {
// app.js
/** 作者 / Author: Alexanker */
const { createApplication } = loadModule(1);

const application = createApplication(document);
application.start();

return {  };
},
1: () => {
// src\core\application.js
const { createProgressStore } = loadModule(2);
const { LEVELS } = loadModule(3);
const { createSceneScope } = loadModule(4);
const { createAudio } = loadModule(5);
const { recordResult } = loadModule(6);
const { levelModules } = loadModule(7);
const { createToast } = loadModule(48);
const { renderNavigation } = loadModule(49);
const { renderHome } = loadModule(50);
const { renderLevelCover } = loadModule(51);
const { renderLevelShell } = loadModule(52);
const { renderResult, renderFinal, updateResultIdentity } = loadModule(53);
const { mountImmersive } = loadModule(54);
const { BRAND, ENABLE_TEST_NAVIGATION } = loadModule(13);
const { createTestSession } = loadModule(55);
const { createTestNavigation } = loadModule(56);
const { showNameDialog, randomNickname } = loadModule(57);

/** 应用层负责导航与存档；关卡通过 context 使用公共服务。 */
function createApplication(document) {
  const root = document.querySelector('#game');
  const levelMap = document.querySelector('#level-map');
  const totalStars = document.querySelector('#total-stars');
  const soundButton = document.querySelector('#sound-button');
  const normalProgress = createProgressStore(localStorage, BRAND.saveKey);
  let progress = normalProgress;
  const testing = () => progress !== normalProgress;
  const testNavigation = ENABLE_TEST_NAVIGATION ? createTestNavigation({
    document,isTesting:testing,
    onJump({level,step}) {
      if(!testing())progress=createTestSession(normalProgress.state);
      soundButton.textContent=progress.state.sound?'♪':'×';
      startLevel(level,step);
    },
    onExit(){progress=normalProgress;soundButton.textContent=progress.state.sound?'♪':'×';goHome();}
  }) : null;
  const scene = createSceneScope();
  const beep = createAudio(() => progress.state.sound);
  const showToast = createToast(document.querySelector('#toast'));
  const menu = document.createElement('dialog');
  menu.id = 'game-menu';
  menu.className = 'scene-sheet';
  menu.innerHTML = '<header><b>关卡与设置</b><button id="menu-close" aria-label="关闭菜单">✕</button></header><div class="menu-settings"></div>';
  document.body.append(menu);
  menu.append(levelMap);
  const settings = menu.querySelector('.menu-settings');
  const profile = document.createElement('section');
  profile.className = 'menu-profile';
  profile.innerHTML = '<p id="profile-summary"></p><button class="secondary" id="edit-nickname">修改实验员昵称</button><button class="secondary" id="edit-chip-name">修改芯片名称</button>';
  settings.append(profile);
  profile.querySelector('#edit-nickname').addEventListener('click', () => {
    menu.close();
    registerExperimenter(() => {}, progress.state.nickname || randomNickname());
  });
  profile.querySelector('#edit-chip-name').addEventListener('click', () => {
    menu.close();
    nameChip(() => {});
  });
  settings.append(document.querySelector('.score-pill'), soundButton, document.querySelector('#reset-button'));
  const home = document.createElement('button');
  home.id = 'menu-home';
  home.className = 'secondary'; home.textContent = '返回实验室首页';
  settings.append(home);
  home.addEventListener('click', goHome);
  document.querySelector('#menu-close').addEventListener('click', () => menu.close());
  menu.addEventListener('click', event => { if (event.target === menu) menu.close(); });
  // 委托给稳定容器，关卡重绘后不用重复注册菜单入口。
  root.addEventListener('click', event => {
    if (event.target.closest('#scene-menu-open,#home-menu-open')) {
      updateProfileSummary();
      menu.showModal();
    }
  });
  function updateProfileSummary() {
    profile.querySelector('#profile-summary').textContent = `实验员：${progress.state.nickname || '尚未登记'} · 芯片：${progress.state.chipName || '尚未命名'}`;
    profile.querySelector('#edit-chip-name').disabled = !progress.state.chipName;
  }
  function registerExperimenter(onRegistered, initialValue = randomNickname()) {
    showNameDialog({
      document, title: '实验员登记',
      message: '尊敬的实验员您好，请您填写昵称注册进入实验室。您也可以使用随机昵称开始实验。',
      label: '实验员昵称', initialValue, placeholder: '填写你喜欢的昵称',
      submitText: '进入实验室 →', maxLength: 16, randomize: randomNickname,
      onSubmit(nickname) {
        progress.state.nickname = nickname;
        persist();
        onRegistered();
      }
    });
  }
  function nameChip(onNamed) {
    showNameDialog({
      document, title: '为你的 qubit 芯片命名',
      message: `${progress.state.nickname}实验员，你已完成芯片制造与封装。为这片芯片起个名字，开启接下来的量子实验吧。`,
      label: '芯片名称', initialValue: progress.state.chipName,
      placeholder: '例如：星河', submitText: '保存芯片名称 →', maxLength: 24,
      onSubmit(chipName) {
        progress.state.chipName = chipName;
        persist();
        onNamed();
      }
    });
  }
  function persist() {
    progress.save();
    updateResultIdentity(root, progress.state);
    renderNavigation({
      levelMap,
      totalStars,
      save: progress.state,
      startLevel
    });
  }
  function goHome() {
    scene.clear();
    menu.close();
    document.body.classList.remove('playing');
    document.body.classList.remove('showing-result');
    progress.state.current = 0;
    persist();
    renderHome({
      game: root,
      save: progress.state,
      startExperiment: () => registerExperimenter(() => startLevel(progress.state.unlocked))
    });
    testNavigation?.attach(root);
  }
  function startLevel(id, testStep = null) {
    if (id > progress.state.unlocked) return;
    if (!testing() && !progress.state.nickname) {
      registerExperimenter(() => startLevel(id, testStep));
      return;
    }
    document.querySelector('#toast').classList.remove('show');
    scene.clear();
    menu.close();
    document.body.classList.add('playing');
    document.body.classList.remove('showing-result');
    progress.state.current = id;
    persist();
    window.scrollTo({
      top: 0,
      behavior: 'smooth'
    });
    if (progress.state.seenCovers[id] || progress.state.stars[id]) {
      beginLevel(id, testStep);
      return;
    }
    renderLevelCover(root, LEVELS[id - 1], () => {
      progress.state.seenCovers[id] = true;
      persist();
      beginLevel(id, testStep);
    }, goHome);
    testNavigation?.attach(root);
  }
  function beginLevel(id, testStep) {
    levelModules[id]({
      root,
      scene,
      beep,
      showToast,
      setStepPurpose: purpose => { root.querySelector('.mission-summary').textContent = purpose; },
      awardLevel,
      chipName: progress.state.chipName,
      testStep: ENABLE_TEST_NAVIGATION && testing() ? testStep : null,
      navigate: startLevel,
      experiment: {
        load: () => progress.state.experiment,
        save: result => {
          progress.state.experiment = result;
          progress.save();
        }
      },
      shell(...args) {
        scene.clear();
        renderLevelShell(root, ...args);
        mountImmersive(root, scene);
        testNavigation?.attach(root);
      }
    });
  }
  function awardLevel(id, metrics, achievements = []) {
    scene.clear();
    if (id === 1 && !progress.state.chipName) {
      nameChip(() => completeLevel(id, metrics, achievements));
      return;
    }
    completeLevel(id, metrics, achievements);
  }
  function completeLevel(id, metrics, achievements) {
    document.body.classList.remove('playing');
    document.body.classList.add('showing-result');
    const result = recordResult(progress.state, id, metrics, achievements);
    persist();
    beep(760, .25);
    renderResult({
      game: root,
      id,
      metrics,
      achievements,
      stars: result.stars,
      save: progress.state,
      startLevel,
      showFinal
    });
    testNavigation?.attach(root);
  }
  function showFinal() {
    scene.clear();
    document.body.classList.remove('playing');
    document.body.classList.add('showing-result');
    progress.state.current = 0;
    persist();
    renderFinal({
      game: root,
      save: progress.state,
      goHome,
      startLevel
    });
    testNavigation?.attach(root);
  }
  function start() {
    document.title = BRAND.pageTitle;

function createInitialProgress() {

    stars: {},
    scores: {},
    seenCovers: {},

  };

/** V2 的关卡含义已改变，独立存档；保留原 V1 数据，不把旧通关误当成新实验。 */
function createProgressStore(storage = localStorage, saveKey = SAVE_KEY) {
  let current;
  try {
    current = {
      ...createInitialProgress(),
      ...JSON.parse(storage.getItem(saveKey) || '{}')
    };
  } catch {
    current = createInitialProgress();
  }
  return {
    get state() {
      return current;
    },
    save() {
      storage.setItem(saveKey, JSON.stringify(current));
    },
    reset() {
      current = createInitialProgress();
      storage.removeItem(saveKey);
    }
  };
}

return { createInitialProgress, createProgressStore };

4: () => {
// src\core\scene.js
/** 管理一个子步骤的资源。切换步骤或离开关卡时统一释放。 */
function createSceneScope() {
  const timeouts = new Set();
  const intervals = new Set();
  const frames = new Set();
  let disposers = [];
  function clear() {
    for (const id of timeouts) window.clearTimeout(id);
    for (const id of intervals) window.clearInterval(id);
    for (const id of frames) window.cancelAnimationFrame(id);
    timeouts.clear();
    intervals.clear();
    frames.clear();
    const pending = disposers;
    disposers = [];
    pending.forEach(dispose => dispose());
  }
  return {
    clear,
    onCleanup(dispose) {
      disposers.push(dispose);
    },
    listen(target, event, handler, options) {
      target.addEventListener(event, handler, options);
      disposers.push(() => target.removeEventListener(event, handler, options));
    },
    timeout(callback, delay) {
      const id = window.setTimeout(() => {
        timeouts.delete(id);
        callback();
      }, delay);
      timeouts.add(id);
      return id;
    },
    interval(callback, delay) {
      const id = window.setInterval(callback, delay);
      intervals.add(id);
      return id;
    },
    cancelInterval(id) {
      window.clearInterval(id);
      intervals.delete(id);
    },
    frame(callback) {
      const id = window.requestAnimationFrame(time => {
        frames.delete(id);
        callback(time);
      });
      frames.add(id);
      return id;
    },
    cancelFrame(id) {
      window.cancelAnimationFrame(id);
      frames.delete(id);
    }
  };
}

return { createSceneScope };
},

// src\core\audio.js
function createAudio(enabled) {
  function beep(frequency = 520, duration = .08) {
    if (!enabled()) return;
    try {
      const ctx = beep.ctx || (beep.ctx = new AudioContext());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.value = frequency;
      gain.gain.setValueAtTime(.055, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
      osc.connect(gain).connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + duration);
    } catch {/* 音效不是核心功能，浏览器拒绝时保持静默。 */}
  }
  return beep;
}

return { createAudio };
},

// src\core\scoring.js
function evaluateMetrics(metrics) {
  const values = Object.values(metrics);
  const average = Math.round(values.reduce((sum, value) => sum + value, 0) / values.length);
  return {
    average,
    stars: average >= 90 ? 3 : average >= 72 ? 2 : 1
  };
}
function recordResult(progress, id, metrics, achievements) {
  const result = evaluateMetrics(metrics);
  progress.stars[id] = Math.max(progress.stars[id] || 0, result.stars);
  progress.scores[id] = Math.max(progress.scores[id] || 0, result.average);
  progress.unlocked = Math.max(progress.unlocked, Math.min(6, id + 1));
  achievements.forEach(name => {
    if (!progress.achievements.includes(name)) progress.achievements.push(name);
  });
  return result;
}

return { evaluateMetrics, recordResult };
},

// src\features\fabrication\index.js
const { LEVELS, STEP_PURPOSES } = loadModule(3);

const { svgPoint, animate, randomBetween } = loadModule(12);
const { mountLaser } = loadModule(11);
const { CHIP_PADS } = loadModule(10);
function mount({
  root,
  scene,
  shell,
  beep,
  showToast,
  setStepPurpose,
  awardLevel,
  testStep = null
}) {
  let wrongTools = 0,
    misbonds = 0,
    traceAccuracy = 100;
  const render = (step, mission, view) => shell(LEVELS[0], step, 4, mission, view);
  function cleaning() {
    const types = ['dust', 'dust', 'dust', 'dust', 'dust', 'organic', 'organic', 'organic', 'stubborn', 'stubborn'];
    const stains = types.map((type, id) => {
      const angle = randomBetween(0, Math.PI * 2),
        distance = randomBetween(30, 184),
        radius = type === 'dust' ? randomBetween(32, 48) : randomBetween(19, 31);
      const points = Array.from({
        length: 12
      }, (_, i) => {
        const r = radius * randomBetween(.75, 1.2);
        return [Math.cos(i * Math.PI / 6) * r, Math.sin(i * Math.PI / 6) * r];
      });
      return {
        id,
        type,
        x: 400 + Math.cos(angle) * distance,
        y: 290 + Math.sin(angle) * distance,
        radius,
        hp: type === 'stubborn' ? 2.5 : 1,
        loosened: false,
        outline: 'M' + points.map(p => p.join(' ')).join('L') + 'Z'
      };
    });
    render(0, '顽固污渍：先按住臭氧探头，变成棕色后切换吹扫。', cleaningView(stains));
    const svg = root.querySelector('#cleaning-surface');
    let tool = 'blow',
      pressed = false,
      point = {
        x: -100,
        y: -100
      },
      lastWarning = 0;
    root.querySelectorAll('[data-tool]').forEach(button => button.addEventListener('click', () => {
      tool = button.dataset.tool;
      root.querySelectorAll('[data-tool]').forEach(b => b.classList.toggle('selected', b === button));
      svg.querySelector('#cleaning-nozzle text').textContent = tool === 'blow' ? 'N₂' : 'O₃';
    }));
    function locate(event) {
      point = svgPoint(svg, event);
      svg.querySelector('#cleaning-nozzle').setAttribute('transform', 'translate(' + point.x + ' ' + point.y + ')');
    }
    scene.listen(svg, 'pointerdown', event => {
      event.preventDefault();
      pressed = true;
      svg.classList.add('cleaning-active');
      svg.setPointerCapture(event.pointerId);
      locate(event);
      svg.querySelector('#cleaning-nozzle').setAttribute('opacity', '1');
    });
    scene.listen(svg, 'pointermove', locate);
    scene.listen(svg, 'pointerup', () => { pressed = false; svg.classList.remove('cleaning-active'); });
    scene.listen(svg, 'pointercancel', () => { pressed = false; svg.classList.remove('cleaning-active'); });
    animate(scene, (time, delta) => {
      if (!pressed) return;
      stains.filter(stain => stain.hp > 0).forEach(stain => {
        if (Math.hypot(point.x - stain.x, point.y - stain.y) > stain.radius + 27) return;
        const correct = tool === 'blow' && (stain.type === 'dust' || stain.loosened) || tool === 'ozone' && stain.type !== 'dust' && !stain.loosened;
        if (!correct) {
          if (time - lastWarning > 2) {
            wrongTools++;
            lastWarning = time;
            root.querySelector('#cleaning-hint').textContent = stain.type === 'dust' ? '大面积浮尘：使用氮气吹扫。' : stain.loosened ? '污染已松动，切换氮气带走残留。' : '有机层需要臭氧氧化分解。';
          }
          return;
        }
        stain.hp -= delta * (tool === 'blow' ? 1.7 : .9);
        const node = svg.querySelector('[data-stain="' + stain.id + '"]');
        if (stain.type === 'stubborn' && !stain.loosened) {
          // 松动与清除是两个阶段：松动只改变颜色，不让污渍提前消失。
          const progress = Math.min(1, 1 - Math.max(0, stain.hp) / 2.5);
          const hardColor = [62, 76, 87], dustColor = [182, 156, 116];
          const color = hardColor.map((value, i) => Math.round(value + (dustColor[i] - value) * progress));
          node.style.opacity = '1';
          node.querySelector('path').setAttribute('fill', 'rgb(' + color.join(',') + ')');
          node.querySelector('text').textContent = '松动 ' + Math.round(progress * 100) + '%';
          root.querySelector('#cleaning-hint').textContent = '保持按住臭氧探头：变成棕色后，再切换吹扫。';
        } else {
          node.style.opacity = Math.max(.15, Math.min(1, stain.hp));
        }
        if (stain.hp <= 0 && stain.type === 'stubborn' && !stain.loosened) {
          stain.loosened = true;
          stain.hp = .75;
          node.classList.add('loosened');
          node.querySelector('text').textContent = '请吹扫';
          node.querySelector('path').setAttribute('fill', '#b69c74');

        } else if (stain.hp <= 0) {
          node.style.opacity = '0';
          node.classList.add('cleaned');
          beep(720, .025);
        }
      });
      const remaining = stains.filter(stain => stain.hp > 0).length;
      root.querySelector('#dirt-count').textContent = remaining;
      root.querySelector('#clean-meter').style.width = (1 - remaining / stains.length) * 100 + '%';

        root.querySelector('#clean-next').classList.add('ready-action');

    root.querySelector('#clean-next').addEventListener('click', lithography);
  }
  function lithography() {
    render(1, '按住亮起的方向键，让红色激光沿白色虚线曝光。紫色是光刻胶，经过的芯片图案会变绿。', lithographyView());

    const surface = root.querySelector('#package-surface'),
      tray = root.querySelector('#chip-tray');
    let installed = false,
      selected = null,
      bonds = 0,
      screws = 0,
      dragging = false;
    // 和芯片绘图共用焊盘坐标；外焊盘沿对应边向外平移，金线不交叉。
    const pads = CHIP_PADS.map((pad, id) => {
      const x = 210 + pad.x * .47, y = 169 + pad.y * .47;
      const dx = pad.x === 58 ? -75 : pad.x === 742 ? 75 : 0;
      const dy = pad.y === 52 ? -57 : pad.y === 448 ? 57 : 0;
      return { id, x, y, outerX: x + dx, outerY: y + dy };
    });
    function guideBond() {
      const nextPad = root.querySelector('.bond-pad.outer:not(.bonded)');
      root.querySelectorAll('.bond-pad').forEach(pad => pad.classList.remove('suggested'));
      if (nextPad) nextPad.classList.add('suggested');
    }
    function install() {
      if (installed) return;
      installed = true;
      setStepPurpose(STEP_PURPOSES.bonding);
      tray.disabled = true;
      tray.hidden = true;
      root.querySelector('.control-panel h3').textContent = '按相同编号连接金线';
      root.querySelector('#packaged-chip').setAttribute('opacity', '1');
      root.querySelector('#package-hint').textContent = '先点样品盒外侧亮起的焊盘，再点芯片上相同编号的焊盘。';
      root.querySelector('#package-status').textContent = '芯片已就位';
      root.querySelector('#bond-pads').innerHTML = pads.map(p => ['inner', 'outer'].map(kind => {
        const x = kind === 'inner' ? p.x : p.outerX, y = kind === 'inner' ? p.y : p.outerY;
        return `<g class="bond-pad ${kind}" data-pad="${p.id}" data-kind="${kind}" transform="translate(${x} ${y})" tabindex="0" role="button" aria-label="${kind === 'inner' ? '芯片' : '样品盒'}焊盘 ${p.id + 1}"><rect class="pad-hit" x="-30" y="-30" width="60" height="60" fill="transparent" stroke="none"/><rect class="pad-metal" x="-10" y="-10" width="20" height="20" rx="2"/><circle class="pad-ring" r="17" fill="none"/><text y="4" text-anchor="middle" font-size="11" fill="#4b3713" stroke="none">${p.id + 1}</text></g>`;
      }).join('')).join('');
      guideBond();
      root.querySelectorAll('.bond-pad').forEach(pad => {
        const connect = () => {
          if (pad.classList.contains('bonded')) return;
          const id = Number(pad.dataset.pad);
          if (pad.dataset.kind === 'outer') {
            root.querySelectorAll('.bond-pad').forEach(p => p.classList.remove('selected'));
            selected = id;
            pad.classList.add('selected');
            root.querySelectorAll('.bond-pad').forEach(p => p.classList.remove('suggested'));
            root.querySelector('.bond-pad.inner[data-pad="' + id + '"]').classList.add('suggested');
            root.querySelector('#package-hint').textContent = '现在点击芯片上亮起的 ' + (id + 1) + ' 号焊盘。';
            return;
          }
          if (selected !== id) {
            showToast('先点样品盒焊盘，再点芯片上同号焊盘；点错不扣分。');
            return;
          }
          const p = pads[id];
          root.querySelector('#bond-wires').insertAdjacentHTML('beforeend', `<path class="bond-wire" pathLength="100" d="M${p.outerX} ${p.outerY} Q${(p.x + p.outerX) / 2 - (p.outerY !== p.y ? 12 : 0)} ${(p.y + p.outerY) / 2 - (p.outerX !== p.x ? 12 : 0)} ${p.x} ${p.y}" fill="none" stroke="#ecc66b" stroke-width="3"/>`);
          root.querySelectorAll('[data-pad="' + id + '"]').forEach(node => { node.classList.add('bonded'); node.classList.remove('selected'); });
          selected = null;
          bonds++;
          guideBond();
          root.querySelector('#package-hint').textContent = bonds === 8 ? '八根金线已连接！安装屏蔽盖。' : '连接成功！先点盒子上亮起的焊盘，再点芯片上的同号焊盘。';
          root.querySelector('#bond-count').textContent = bonds + ' / 8';
          beep(700, .05);
          if (bonds === 8) { root.querySelector('#mount-lid').disabled = false; root.querySelector('#mount-lid').classList.add('ready-action'); setStepPurpose(STEP_PURPOSES.lid); }
        };
        pad.addEventListener('click', connect);
        pad.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            connect();
          }
        });
      });
    }
    tray.addEventListener('click', () => {
      root.querySelector('#package-hint').textContent = '芯片已选中，点击样品盒中央完成放置。';
    });
    scene.listen(tray, 'pointerdown', event => {
      dragging = true;
      tray.setPointerCapture(event.pointerId);
      tray.classList.add('dragging');
    });
    scene.listen(tray, 'pointerup', event => {
      if (!dragging) return;
      dragging = false;
      tray.classList.remove('dragging');
      const p = svgPoint(surface, event);
      if (p.x > 187 && p.x < 601 && p.y > 157 && p.y < 421) install();
    });
    scene.listen(tray, 'pointercancel', () => {
      dragging = false;
      tray.classList.remove('dragging');
    });
    surface.addEventListener('click', () => {
      if (!installed) install();
    });
    root.querySelector('#mount-lid').addEventListener('click', event => {
      event.currentTarget.disabled = true;
      root.querySelector('#package-lid').classList.add('lowering');
      root.querySelector('#package-lid').setAttribute('opacity', '1');
      root.querySelector('#bond-pads').setAttribute('pointer-events', 'none');
      root.querySelector('#package-hint').textContent = '屏蔽盖已放下，依次拧紧四个角的螺丝。';
      root.querySelector('#lid-screws').innerHTML = [[170, 121], [620, 121], [170, 454], [620, 454]].map((p, i) => `<g class="lid-screw" data-screw="${i}" transform="translate(${p[0]} ${p[1]})" role="button" tabindex="0" aria-label="拧紧螺丝 ${i + 1}"><circle r="12"/><path d="M-6 0H6M0-6V6"/></g>`).join('');
      root.querySelectorAll('.lid-screw').forEach(screw => {
        const tighten = () => {
          if (screw.classList.contains('tight')) return;
          screw.classList.add('tight');
          screws++;
          beep(490, .07);
          if (screws === 4) {
            root.querySelector('#package-finish').disabled = false;
            root.querySelector('#package-status').textContent = 'RF SEALED / 已密封';
          }
        };
        screw.addEventListener('click', tighten);
        screw.addEventListener('keydown', event => {
          if (event.key === 'Enter') tighten();
        });
      });
    });
    root.querySelector('#package-finish').addEventListener('click', () => awardLevel(1, {
      '材料洁净': Math.max(70, 100 - wrongTools * 2),
      '图形精度': traceAccuracy,
      '键合质量': Math.max(60, 100 - misbonds * 6)
    }, misbonds === 0 ? ['精密封装工程师'] : []));
    if(testStep==='bonding'||testStep==='lid')install();
    if(testStep==='lid') {
      for(let id=0;id<8;id++) for(const kind of ['outer','inner']) {
        root.querySelector(`[data-pad="${id}"][data-kind="${kind}"]`).dispatchEvent(new MouseEvent('click',{bubbles:true}));
      }
    }
  }
  const entry = {lithography,processing,develop:processing,etch:processing,strip:processing,packaging,bonding:packaging,lid:packaging};
  (entry[testStep] || cleaning)();
}

return { mount };
},

11: () => {
// src\features\fabrication\laser.js
const { animate } = loadModule(12);

// 路线拆为正交线段；转角自动停靠，不要求玩家精确描线。
const LASER_ROUTES = [
  { name: '十字电容', points: [[388,281],[412,281],[412,324],[455,324],[455,348],[412,348],[412,391],[388,391],[388,348],[345,348],[345,324],[388,324],[388,281]] },
  { name: '读取弯线', points: [[428,130],[428,152],[372,152],[372,175],[428,175],[428,198],[372,198],[372,221],[428,221],[428,244],[400,244],[400,268]] },
  { name: '微小连接结', points: [[400,391],[400,413]] }
];
function routePath(points) {
  return points.map((p, i) => `${i ? 'L' : 'M'}${p[0]} ${p[1]}`).join('');
}

function mountLaser({ root, scene, beep, onComplete }) {
  let routeIndex = 0, segmentIndex = 0, travelled = 0, distanceDone = 0;
  let heldDirection = null, finished = false;
  const totalDistance = LASER_ROUTES.reduce((sum, route) => sum + route.points.slice(1).reduce((length, p, i) =>
    length + Math.hypot(p[0] - route.points[i][0], p[1] - route.points[i][1]), 0), 0);
  const buttons = [...root.querySelectorAll('[data-direction]')];
  function release() {
    heldDirection=null;
    root.querySelector('#laser-head').classList.remove('firing');
  }
  const names = { ArrowUp: '↑ 上', ArrowDown: '↓ 下', ArrowLeft: '← 左', ArrowRight: '→ 右' };
  function segment() {
    const points = LASER_ROUTES[routeIndex].points;
    const a = points[segmentIndex], b = points[segmentIndex + 1];
    const length = Math.hypot(b[0] - a[0], b[1] - a[1]);
    const direction = b[0] > a[0] ? 'ArrowRight' : b[0] < a[0] ? 'ArrowLeft' : b[1] > a[1] ? 'ArrowDown' : 'ArrowUp';
    return { a, b, length, direction };
  }
  function draw() {
    const { a, b, length, direction } = segment();
    const fraction = travelled / length;
    const x = a[0] + (b[0] - a[0]) * fraction, y = a[1] + (b[1] - a[1]) * fraction;
    root.querySelector('#laser-head').setAttribute('transform', `translate(${x} ${y})`);
    root.querySelector('#laser-target').setAttribute('cx', b[0]);
    root.querySelector('#laser-target').setAttribute('cy', b[1]);
    const completed = LASER_ROUTES[routeIndex].points.slice(0, segmentIndex + 1);
    root.querySelector(`#laser-ink-${routeIndex}`).setAttribute('d', routePath([...completed, [x, y]]));
    const percent = Math.round((distanceDone + travelled) / totalDistance * 100);
    root.querySelector('#coverage').textContent = `${percent}%`;
    root.querySelector('#trace-meter').style.width = `${percent}%`;
    root.querySelector('#laser-hint').textContent = `画芯片：${LASER_ROUTES[routeIndex].name} · 按住 ${names[direction]}`;
    buttons.forEach(button => button.classList.toggle('next-direction', button.dataset.direction === direction));
    root.querySelector('#trace-surface').dataset.direction = direction;
  }
  buttons.forEach(button => {
    scene.listen(button, 'pointerdown', event => {
      event.preventDefault();
      button.setPointerCapture(event.pointerId);
      heldDirection = button.dataset.direction;
    });
    scene.listen(button, 'pointerup', release);
    scene.listen(button, 'pointercancel', release);
  });
  scene.listen(window, 'keydown', event => {
    if (!(event.key in names) || /INPUT|SELECT|TEXTAREA/.test(event.target.tagName)) return;
    event.preventDefault();
    heldDirection = event.key;
  });
  scene.listen(window, 'keyup', event => { if (event.key === heldDirection) release(); });
  scene.listen(window, 'blur', release);
  draw();
  animate(scene, (_, delta) => {
    if (finished) return;
    const current = segment();
    const moving = heldDirection === current.direction;
    root.querySelector('#laser-head').classList.toggle('firing', moving);
    if (!moving) return;
    travelled = Math.min(current.length, travelled + delta * 120);
    draw();
    if (travelled < current.length) return;
    beep(600 + routeIndex * 160, .018);
    distanceDone += current.length;
    travelled = 0;
    segmentIndex++;
    if (segmentIndex === LASER_ROUTES[routeIndex].points.length - 1) {
      routeIndex++;
      segmentIndex = 0;
      if (routeIndex === LASER_ROUTES.length) {
        finished = true;
        root.querySelector('#laser-head').classList.remove('firing');
        root.querySelector('#laser-hint').textContent = '芯片图案曝光完成 · 进入显影';
        buttons.forEach(button => { button.disabled = true; button.classList.remove('next-direction'); });
        root.querySelector('#trace-next').disabled = false;
        root.querySelector('#trace-next').classList.add('ready-action');
        onComplete();
        return;
      }
    }
    draw();
  });
}

return { LASER_ROUTES, routePath, mountLaser };
},

// src\shared\interaction.js
function svgPoint(svg, event) {
  const point = new DOMPoint(event.clientX, event.clientY);
  return point.matrixTransform(svg.getScreenCTM().inverse());
}
function animate(scene, render) {
  let previous = performance.now();
  function frame(now) {
    const delta = Math.min((now - previous) / 1000, .08);
    previous = now;
    render(now / 1000, delta);
    scene.frame(frame);
  }
  scene.frame(frame);
}
function randomBetween(min, max) {
  return min + Math.random() * (max - min);
}
function shuffle(values) {
  return values.map(value => ({
    value,
    key: Math.random()
  })).sort((a, b) => a.key - b.key).map(item => item.value);
}

return { svgPoint, animate, randomBetween, shuffle };
},

14: () => {
// src\features\installation\index.js
const { LEVELS, STEP_PURPOSES } = loadModule(3);
const { installationView } = loadModule(15);
const { COMPONENTS, CONNECTORS } = loadModule(17);
const { shuffle } = loadModule(12);
const { createSignalTest } = loadModule(18);
function mount({
  root,
  scene,
  shell,
  showToast,
  beep,
  awardLevel,
  setStepPurpose,
  chipName = '',
  testStep = null
}) {
  const broken = new Set(shuffle(CONNECTORS).slice(0, 3).map(c => c.id));
  const installed = new Set(),
    reversed = new Set();
  let selected = null,
    mistakes = 0,
    attempts = 0,
    testing = false;
  shell(LEVELS[1], 0, 1, '先选器件，再点温级安装位。检查线路通断；隔离器、放大器箭头须朝上，点击器件可翻转。', installationView(broken));
  if (chipName) root.querySelector('#link-feedback').textContent = `安装你的「${chipName}」芯片，并为它接通控制与读出链路。`;
  const parts = root.querySelectorAll('[data-part]'),
    slots = root.querySelectorAll('[data-slot]');
  const testSignal=createSignalTest(root,scene);
  parts.forEach(part => {
    part.addEventListener('click', () => {
      selected = part.dataset.part;
      parts.forEach(p => p.classList.toggle('selected', p === part));
    });
    part.addEventListener('dragstart', event => {
      event.dataTransfer.setData('text/plain', part.dataset.part);
    });
  });
  function place(id, slot) {
    if (testing) return;
    if (installed.has(id)) return;
    if (id !== slot.dataset.slot) {
      mistakes++;
      showToast('这个安装位不匹配，请核对温级与左右链路。');
      return;
    }
    const component = COMPONENTS.find(c => c.id === id);
    installed.add(id);
    if (component.directional && (id === 'isolator' || Math.random() > .5)) reversed.add(id);
    slot.classList.add('installed', component.kind);
    slot.querySelector('.slot-symbol').textContent = component.directional ? reversed.has(id) ? '↓' : '↑' : component.kind === 'chip' ? '5Q' : component.kind === 'filter' ? 'LPF' : '20dB';
    slot.querySelector('.slot-label').textContent = component.name;
    root.querySelector('[data-part="' + id + '"]').disabled = true;
    root.querySelector('#installed-count').textContent = installed.size + ' / 7';
    root.querySelector('#test-chain').disabled = false;
    selected = null;
    parts.forEach(p => p.classList.remove('selected'));
    beep(580, .04);
    if (component.directional && testStep !== 'shields') showToast('这是有向器件：检查箭头朝上，点已安装的器件可翻转。');
  }
  slots.forEach(slot => {
    slot.addEventListener('dragover', e => {
      e.preventDefault();
      slot.classList.add('hover');
    });
    slot.addEventListener('dragleave', () => slot.classList.remove('hover'));
    slot.addEventListener('drop', e => {
      e.preventDefault();
      slot.classList.remove('hover');
      place(e.dataTransfer.getData('text/plain'), slot);
    });
    const activate = () => {
      if (testing) return;
      if (selected) {
        place(selected, slot);
        return;
      }
      const component = COMPONENTS.find(c => c.id === slot.dataset.slot);
      if (installed.has(component.id) && component.directional) {
        reversed.has(component.id) ? reversed.delete(component.id) : reversed.add(component.id);
        slot.querySelector('.slot-symbol').textContent = reversed.has(component.id) ? '↓' : '↑';
        slot.classList.remove('fault');
      }
    };
    slot.addEventListener('click', activate);
    slot.addEventListener('keydown', e => {
      if (e.key === 'Enter') activate();
    });
  });
  root.querySelectorAll('[data-link]').forEach(connector => {
    const activate = () => {
      if (testing) return;
      const id = Number(connector.dataset.link);
      broken.has(id) ? broken.delete(id) : broken.add(id);
      connector.classList.toggle('broken', broken.has(id));
      connector.classList.remove('fault');
      beep(460, .03);
    };
    connector.addEventListener('click', activate);
    connector.addEventListener('keydown', e => {
      if (e.key === 'Enter') activate();
    });
  });
  root.querySelector('#test-chain').addEventListener('click', event => {
    testing = true;
    attempts++;
    event.currentTarget.disabled = true;
    root.querySelectorAll('.fault').forEach(node => node.classList.remove('fault'));
    root.querySelector('#link-feedback').textContent = '双频波包传播：两次衰减后波峰为原始的 ⅓，滤波器移除高频；此为教学比例。';
    testSignal(installed,reversed,broken,fault => {
      testing = false;
      if (fault) {
        root.querySelector('#test-chain').disabled = false;
        root.querySelector(fault.type === 'link' ? '[data-link="' + fault.id + '"]' : '[data-slot="' + fault.id + '"]').classList.add('fault');
        root.querySelector('#link-feedback').textContent = fault.type === 'link' ? '信号在接头处中断。点击红色接头恢复方向。' : fault.type==='missing'? '缺少'+fault.name+'，请安装标红位置。':fault.name + '方向错误，反向信号已停在上一个正确器件。点击红色器件翻转箭头。';
        showToast('链路尚未通过：请排除标红位置。');
      } else {
        root.querySelector('#link-feedback').textContent = '输入 → 衰减 / 滤波 → 芯片 → 隔离 → 放大 → 输出，全部通过。';
        root.querySelector('#seal-fridge').disabled = false;
        root.querySelector('#install-status').textContent = 'SIGNAL VERIFIED';
        slots.forEach(slot => slot.style.pointerEvents = 'none');
        root.querySelectorAll('[data-link]').forEach(c => c.style.pointerEvents = 'none');
        beep(760, .18);
      }
    });
  });
  let shieldLayer = 0;
  root.querySelector('#seal-fridge').addEventListener('click', event => {
    setStepPurpose(STEP_PURPOSES.shields);
    event.currentTarget.disabled = true;
    shieldLayer++;
    root.querySelector('[data-shield="' + shieldLayer + '"]').classList.add('mounted');
    const shields = ['安装 10 mK 屏蔽筒','安装 4 K 辐射屏', '安装 50 K 辐射屏', '安装真空外罐'];
    root.querySelector('#install-status').textContent = shields[shieldLayer - 1];
    root.querySelector('.microwave-chain').classList.add('covered');
    root.querySelector('.fridge-svg').classList.add('shielded');
    scene.timeout(() => {
      if (shieldLayer < 4) {
        root.querySelector('#seal-fridge').disabled = false;
        root.querySelector('#seal-fridge').textContent = shields[shieldLayer];
      } else {
        root.querySelector('#install-finish').disabled = false;
        root.querySelector('#install-status').textContent = '四层封装完成';
      }
    }, 1300);
  });
  root.querySelector('#install-finish').addEventListener('click', () => awardLevel(2, {
    '器件安装': Math.max(65, 100 - mistakes * 5),
    '链路诊断': Math.max(65, 105 - attempts * 5),
    '完整性': 100
  }, attempts === 1 ? ['微波链路专家'] : []));
  if(testStep==='shields') {
    setStepPurpose(STEP_PURPOSES.shields);
    COMPONENTS.forEach(component=>place(component.id,root.querySelector(`[data-slot="${component.id}"]`)));
    reversed.clear();broken.clear();
    COMPONENTS.filter(component=>component.directional).forEach(component=>root.querySelector(`[data-slot="${component.id}"] .slot-symbol`).textContent='↑');
    root.querySelectorAll('[data-link]').forEach(node=>node.classList.remove('broken'));
    root.querySelector('#test-chain').disabled=true;
    root.querySelector('#seal-fridge').disabled=false;
    root.querySelector('#link-feedback').textContent='测试预置：器件就位、方向正确、链路连通，可逐层加盖。';
  }
}

return { mount };
},

// src\features\installation\views.js
const { fridgeSvg } = loadModule(16);
const { COMPONENTS, CONNECTORS, SIGNAL_ROUTE } = loadModule(17);
const { shuffle } = loadModule(12);
function installationView(broken) {
  const overlay = `<g class="microwave-chain">
 <path class="signal-base" d="${SIGNAL_ROUTE}" fill="none" stroke="#caa044" stroke-width="5"/>
